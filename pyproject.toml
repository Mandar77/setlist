# Setlist monorepo root.
# This project is a uv workspace: each Python package/service under packages/ and
# services/ is its own distribution, resolved against one shared lockfile.
[project]
name = "setlist-workspace"
version = "0.0.0"
description = "Setlist — text-to-playlist generator (workspace root; not published)"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    # Workspace members, installed editable so tests import the working tree.
    "setlist-core",
    "setlist-etl",
    # ADR-014: jiwer is the CER/WER reference, diffed against the TypeScript
    # harness. Scoped to that differential and deleted with it.
    "setlist-ocr-metrics-oracle",
    # The DynamoDB Local adapter tests only. Not a dependency of packages/etl itself:
    # the Lambda runtime provides boto3, and a unit test should not need AWS installed
    # to import a pure function.
    "boto3==1.43.103",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "hypothesis>=6.122",
    "mypy>=1.14",
    "ruff>=0.9",
    # Imported by tools/check_ledger.py, check_due_tasks.py and check_suppressions.py.
    # It was reaching those only as a transitive dependency of cfn-lint, which is a
    # thing that is true until it is not; the Makefile had been papering over it with
    # `uv run --with pyyaml` on each call site, and the unit tests could not.
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    # CloudFormation linting for infra/bootstrap/account-bootstrap.yaml, the one
    # template a human uploads by hand. cfn-lint is Python-only; there is no Node
    # equivalent, which is why ADR-004 tolerates it here.
    "cfn-lint>=1.22",
]

[tool.uv.workspace]
# Named, not globbed. ADR-004 makes Node the default and Python the exception, so a
# glob like `services/*` would claim every TypeScript service for the Python workspace
# — and `services/adapters/*` referred to a layout that no longer exists.
#
# The exceptions, and why each one is allowed to be Python:
#   tools/oracle-py  — the frozen reference implementation (CORE-01); deleted at CORE-07
#   packages/etl     — must stay Glue-compatible
#   services/ocr     — RapidOCR is Python-first; it returns raw lines and holds no grammar
#
# A member listed here that does not exist yet is simply not resolved, so entries can
# land before their directories do.
members = ["packages/etl", "services/ocr", "tools/oracle-py", "tools/ocr-eval/oracle-py"]

[tool.uv.sources]
setlist-core = { workspace = true }
setlist-etl = { workspace = true }
setlist-ocr-metrics-oracle = { workspace = true }

[tool.uv]
# A dependency cooldown, matching `minimumReleaseAge` on the pnpm side and the
# Dependabot cooldown. All three are seven days, which is the point: a staggered set
# would just mean the shortest one decides.
#
# The PyPI compromises that matter are caught within hours -- a maintainer account is
# taken over, a malicious version is published, it is yanked the same day. Refusing to
# resolve anything published in the last week means this project never sees that
# window. The cost is that an urgent legitimate patch is also a week late, which is the
# right trade here and would not be for a project with users.
exclude-newer = "7 days"

# Keep the dev toolchain identical across every workspace member.
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["tools/oracle-py/src", "services", "tests"]
extend-exclude = [
    "cdk.out",
    "node_modules",
    # Ruff formats Python fenced inside markdown. These two files are transcriptions of
    # external documents, so reformatting them would silently rewrite quoted spec text
    # away from its source. Fidelity to the original wins over house style here; the
    # code inside them is illustrative, never executed.
    "docs/PRD.md",
    "docs/PED.md",
]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E", "W",  # pycodestyle
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "DTZ",  # naive datetimes
    "T20",  # no print
    "PT",   # pytest style
    "RET",  # returns
    "SIM",  # simplify
    "TID",  # tidy imports
    "PTH",  # pathlib
    "PL",   # pylint
    "RUF",
    "S",    # bandit
    "ANN",  # annotations
    "D",    # docstrings
]
ignore = [
    "D100", "D104",  # module/package docstrings not mandatory
    "D203", "D213",  # conflicting docstring conventions
    "PLR0913",       # arg count — matching/scoring functions legitimately take many
]

# Parsing real-world song lists means handling en/em dashes, hyphen bullets and
# fullwidth forms as first-class input. They appear in patterns and fixtures by
# design, so RUF001 would be pure noise on exactly the characters that matter.
allowed-confusables = ["–", "—", "―", "‐", "−", "·", "⁃", "Ａ", "Ｂ"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D", "ANN", "PLR2004"]   # asserts, docstrings, magic numbers
"**/conftest.py" = ["D", "ANN"]
# CLI entrypoints: stdout is the interface. These also shell out to `git` by name,
# which S603/S607 flag - resolving git from PATH is correct here, and hardcoding an
# absolute path would be less portable without being safer. No argument is ever
# built from untrusted input.
"tools/**" = ["T201", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = false
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool", "ignore-without-code"]
# `tools/oracle-py` itself, not just its src, so that `golden` resolves: the oracle's
# freeze script sits beside the package rather than inside it.
mypy_path = ["tools/oracle-py/src", "tools/oracle-py"]
# Add each service directory here as it gains code; mypy errors on empty ones.
files = ["tools/oracle-py/src", "tools/oracle-py/tests", "tests"]
exclude = '(cdk\.out|node_modules)'

# tests/ is a package (see tests/__init__.py) so this pattern resolves.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

# The oracle's tests, named one by one rather than globbed.
#
# They have no __init__.py, so mypy sees each as a top-level module named after its
# file, and a pattern like `test_*` is not a legal override — mypy accepts `*` only as a
# whole dotted component, and prints a warning rather than failing if you try.
#
# Listing them is the better shape anyway. These six moved here from tests/unit with
# CORE-01 and carry the relaxation they already had; anything added later is checked
# under full strictness, which is the right default for new code in a package whose
# whole job is to not change.
[[tool.mypy.overrides]]
module = [
    "conftest",
    "test_dedupe",
    "test_grounding",
    "test_normalize",
    "test_parsers",
    "test_pipeline",
    "test_properties",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
# Every Python test directory. A package missing from this list still passes its own
# `pytest <path>` run and is NOT collected by `make verify`, which is the quiet way to
# end up with an unchecked package -- packages/etl was exactly that for one commit.
testpaths = ["tests", "packages/etl/tests", "services/ocr/tests", "tools/oracle-py/tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "unit: fast, no I/O, no AWS, no provider calls",
    "integration: requires deployed AWS resources (dev account)",
    "contract: validates provider API schemas against recorded fixtures",
    "accuracy: golden-set extraction/matching regression gates",
    "local_aws: requires DynamoDB Local in Docker; no AWS account and no credentials",
    "e2e: full stack through the UI",
    "slow: takes more than a second",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["tools/oracle-py/src", "services"]
omit = ["*/tests/*", "*/__main__.py"]
relative_files = true

[tool.coverage.report]
# PRD §9 PR quality gates: >=85% line, >=75% branch.
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
    'class .*\(Protocol\):',
    '^\s*\.\.\.$',
]
