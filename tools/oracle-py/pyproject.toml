[project]
name = "setlist-core"
version = "0.1.0"
description = "Shared domain core for Setlist: models, normalizers, deterministic parsers, grounding."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.10",
    # Transliteration for normalized dedup/match keys. anyascii is ISC-licensed;
    # `unidecode` is GPL and must not be used here.
    "anyascii>=0.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setlist_core"]
