# A CI runner has 7GB and AGP's default is lower than this build wants; an OOM in the
# Gradle daemon surfaces as a truncated stack trace with no mention of memory.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

android.useAndroidX=true
# Non-transitive R classes: the AGP default since 8, stated so a future default change
# cannot alter what this builds without a diff to review.
android.nonTransitiveRClass=true
