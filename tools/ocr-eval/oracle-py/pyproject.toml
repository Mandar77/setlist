[project]
name = "setlist-ocr-metrics-oracle"
version = "0.0.0"
description = "jiwer as the reference for CER and WER, diffed against the TypeScript harness (ADR-014)."
requires-python = ">=3.13"
dependencies = ["jiwer==4.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_metrics_oracle"]
