# FR-M-015: all three variants install side by side (M1-01).
#
# The claim is about Android package ids, and the only way to be sure three apps coexist
# is to install three apps and open each one. A unit test can prove the ids differ —
# `test/variant.test.ts` does — but it cannot prove the build actually used them, which is
# where the mistake would be.
#
# Each variant renders its own display name, so launching by package id and reading the
# heading is what distinguishes "three apps installed" from "one app installed thrice".

appId: com.setlist.app.dev
---
- launchApp:
    appId: 'com.setlist.app.dev'
    clearState: true
- assertVisible: 'Setlist'
- assertVisible:
    id: 'paste-input'
- stopApp:
    appId: 'com.setlist.app.dev'

- launchApp:
    appId: 'com.setlist.app.stage'
    clearState: true
- assertVisible: 'Setlist'
- assertVisible:
    id: 'paste-input'
- stopApp:
    appId: 'com.setlist.app.stage'

- launchApp:
    appId: 'com.setlist.app'
    clearState: true
- assertVisible: 'Setlist'
- assertVisible:
    id: 'paste-input'
- stopApp:
    appId: 'com.setlist.app'

# And back to the first one, still installed and still its own app rather than having been
# replaced by whichever installed last — which is exactly what a shared id would cause.
- launchApp:
    appId: 'com.setlist.app.dev'
- assertVisible:
    id: 'paste-input'
