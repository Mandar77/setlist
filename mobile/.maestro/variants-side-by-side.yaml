# FR-M-015: all three variants install side by side (M1-01).
#
# The claim is about Android package ids, and the only way to be sure three apps coexist
# is to install three apps and open each one. A unit test can prove the ids differ —
# `test/variant.test.ts` does — but it cannot prove the build actually used them, which is
# where the mistake would be.
#
# Launching by package id and waiting for that app's own screen is what distinguishes
# "three apps installed" from "one app installed thrice".
#
# `extendedWaitUntil` on a testID rather than `assertVisible` on the heading text. A bare
# assertion races the first frame of a cold launch — this flow passed one run and failed
# the next on exactly that, which is worse than failing consistently, because a gate that
# is right most of the time teaches people to re-run it.

appId: com.setlist.app.dev
---
- launchApp:
    appId: 'com.setlist.app.dev'
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'paste-input'
    timeout: 30000
- stopApp:
    appId: 'com.setlist.app.dev'

- launchApp:
    appId: 'com.setlist.app.stage'
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'paste-input'
    timeout: 30000
- stopApp:
    appId: 'com.setlist.app.stage'

- launchApp:
    appId: 'com.setlist.app'
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'paste-input'
    timeout: 30000
- stopApp:
    appId: 'com.setlist.app'

# And back to the first one, still installed and still its own app rather than having been
# replaced by whichever installed last — which is exactly what a shared id would cause.
- launchApp:
    appId: 'com.setlist.app.dev'
- extendedWaitUntil:
    visible:
      id: 'paste-input'
    timeout: 30000
