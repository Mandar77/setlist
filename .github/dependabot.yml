# Dependency updates, into develop.
#
# Targeting `develop` rather than `main` matters: ADR-005 reserves the merge to main
# for the human, and a bot opening PRs against main would ask it to break that rule
# every week.
#
# `github-actions` is the ecosystem worth the most here. Every action is pinned to a
# commit SHA (M0A-04), which is the right call for supply-chain safety and also means
# nothing updates on its own — a pinned action silently rots until something bumps it,
# and this is the something.
#
# Every ecosystem below sets a `cooldown`, matching `minimumReleaseAge` in
# pnpm-workspace.yaml and `exclude-newer` in pyproject.toml. Without it Dependabot
# would do the one thing those two settings exist to prevent: open a PR for a version
# published minutes ago, which auto-merge would then land. Three cooldowns and one
# automerge is not a contradiction only if all three agree.
#
# `default-days` alone did not do that. The per-type keys below are not redundant with
# it: Dependabot's job definition carries `semver-major-days: 0`, `semver-minor-days: 0`
# and `semver-patch-days: 0` unless they are set, and those win. The visible effect was
# a PR bumping `@types/node` across four majors to a release three days old, opened
# while `default-days: 7` sat right here — and then, because that landed versions pnpm
# refuses to resolve, every later Dependabot run died at `pnpm install` before it could
# propose anything. A cooldown that is configured, reported back, and acts on nothing
# is the same shape as `blockExoticSubDependencies`, which was the last one of these.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    target-branch: develop
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      # One PR for the patch noise, individual PRs for anything that can actually
      # break. A weekly flood of single-patch PRs is how dependency review stops
      # happening.
      patch-and-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    target-branch: develop
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      patch-and-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    target-branch: develop
    open-pull-requests-limit: 5
    labels: [dependencies, actions]
    commit-message:
      prefix: 'chore(actions)'
