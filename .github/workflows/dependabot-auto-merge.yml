name: Dependabot auto-merge

# Patch and minor updates merge themselves into develop once CI is green. Majors never
# do.
#
# The distinction is the whole point. A major version is a behaviour change someone has
# to read about; a patch is the thing that sits unreviewed for six weeks and then gets
# merged in a batch nobody looks at. Automating the second is what makes it possible to
# take the first seriously.
#
# `pull_request_target` is NOT used here, deliberately. It would run with write access
# in the context of a PR branch, which on a public repository is the standard path to
# someone else's code holding a token with write scope. `pull_request` plus an actor
# check is enough: the merge is requested through the API, and branch protection still
# gates it on CI.
on:
  pull_request:
    # Spelled out rather than left to the default, because the default is where the
    # 2026-10-03 failure lived. `synchronize` is the event that fires when Dependabot
    # rewrites a PR in place — the patch 5.7.2 -> 5.7.3 becoming the major 5.7.2 -> 6.0.3
    # on the same branch — and `edited` covers a retargeted base or a rewritten title.
    # Every one of these is a chance for the PR's classification to have changed under an
    # arming that was correct when it was made.
    types: [opened, synchronize, reopened, edited]
  # Also on push, which is not about policing anything — it is about EXISTING.
  #
  # ADR-011 makes this job a required status check on develop. A ruleset's required
  # checks apply to direct pushes as well as to pull requests, and the autopilot's normal
  # flow is a fast-forward push of a commit built on a task branch (ADR-005). A check
  # that only ever runs on `pull_request` would simply never be present on such a commit,
  # and "required but absent" blocks the push — which would stop the loop dead in the
  # name of a Dependabot rule that has nothing to say about it.
  #
  # So the job runs on these pushes too and reports success immediately. The condition
  # that used to live on the job now lives on the steps: see `policing` below.
  push:
    branches: [develop, 'task/**']

permissions:
  contents: read

jobs:
  auto-merge:
    # Stable name: ADR-011 makes this a required status check, and a required check is
    # matched by name. Renaming it silently stops gating. It covers both directions now,
    # so the name says policy rather than "enable".
    name: Dependabot auto-merge policy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Both halves are needed. `github.actor` alone is spoofable by a PR title; the
      # metadata step verifies against Dependabot's own data.
      #
      # This was the job-level `if`. It had to move to the steps so the job still runs —
      # and therefore still reports — on everything else. A skipped job and a successful
      # job are not the same thing to a required status check.
      POLICING: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.pull_request.base.ref == 'develop' }}
    steps:
      - name: Nothing to police
        if: env.POLICING != 'true'
        run: echo "not a Dependabot pull request into develop — reporting success so the required check exists"

      - name: Read the update's metadata
        id: metadata
        if: env.POLICING == 'true'
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        # `semver-major` is excluded, and so is anything the metadata step could not
        # classify — an unknown update type is not a safe one.
        if: >-
          env.POLICING == 'true' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disarm auto-merge on anything that is not patch or minor
        # This step exists because the workflow could previously only ARM auto-merge and
        # never disarm it, and on 2026-10-03 a major merged itself into develop anyway.
        #
        # Dependabot had been unable to resolve for two days, so PR #14 sat open as the
        # patch 5.7.2 -> 5.7.3 with auto-merge correctly armed. When resolution started
        # working it rewrote that same PR, on that same branch, into 5.7.2 -> 6.0.3. The
        # workflow re-ran on `synchronize`, read `semver-major`, and correctly skipped
        # the arming step — but auto-merge is GitHub-side state, not a per-push decision,
        # so the arming from when it was a patch was still live. CI went green and
        # TypeScript 6 landed on develop, breaking `types-ts` with 22 errors.
        #
        # Skipping an arm is not the same as disarming. A PR's classification can change
        # under an arming that was right when it was made, so the negative branch has to
        # act rather than do nothing. Unclassified counts as not-safe here too, for the
        # same reason it does above.
        # `env.POLICING` is load-bearing here and not merely tidy. On a push the metadata
        # step is skipped, so `update-type` is the empty string — and an empty string is
        # neither 'semver-patch' nor 'semver-minor', so without this guard the condition
        # is TRUE and the disarm would run on every push with no pull request to disarm.
        # A negative condition over a value that may not exist defaults to firing.
        if: >-
          env.POLICING == 'true' &&
          steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
          steps.metadata.outputs.update-type != 'version-update:semver-minor'
        # The logic lives in a script so it can be tested. A workflow step is unreachable
        # from a test runner, and "the step exists" is not the property that matters —
        # "the step calls the API" is. tools/test-dependabot-disarm.sh runs it against a
        # stubbed `gh` and asserts five behaviours, including that an API failure fails
        # the job rather than passing silently.
        run: bash scripts/ci/dependabot-disarm.sh "$PR_URL" "$UPDATE_TYPE"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Say why a major was left alone
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-major' }}
        run: gh pr comment "$PR_URL" --body "Major version bump — left for a human to read the changelog."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
