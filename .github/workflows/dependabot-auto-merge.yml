name: Dependabot auto-merge

# Patch and minor updates merge themselves into develop once CI is green. Majors never
# do.
#
# The distinction is the whole point. A major version is a behaviour change someone has
# to read about; a patch is the thing that sits unreviewed for six weeks and then gets
# merged in a batch nobody looks at. Automating the second is what makes it possible to
# take the first seriously.
#
# `pull_request_target` is NOT used here, deliberately. It would run with write access
# in the context of a PR branch, which on a public repository is the standard path to
# someone else's code holding a token with write scope. `pull_request` plus an actor
# check is enough: the merge is requested through the API, and branch protection still
# gates it on CI.
on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge for patch and minor
    runs-on: ubuntu-latest
    # Both halves are needed. `github.actor` alone is spoofable by a PR title; the
    # metadata step below verifies against Dependabot's own data.
    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.base.ref == 'develop' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update's metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        # `semver-major` is excluded, and so is anything the metadata step could not
        # classify — an unknown update type is not a safe one.
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disarm auto-merge on anything that is not patch or minor
        # This step exists because the workflow could previously only ARM auto-merge and
        # never disarm it, and on 2026-10-03 a major merged itself into develop anyway.
        #
        # Dependabot had been unable to resolve for two days, so PR #14 sat open as the
        # patch 5.7.2 -> 5.7.3 with auto-merge correctly armed. When resolution started
        # working it rewrote that same PR, on that same branch, into 5.7.2 -> 6.0.3. The
        # workflow re-ran on `synchronize`, read `semver-major`, and correctly skipped
        # the arming step — but auto-merge is GitHub-side state, not a per-push decision,
        # so the arming from when it was a patch was still live. CI went green and
        # TypeScript 6 landed on develop, breaking `types-ts` with 22 errors.
        #
        # Skipping an arm is not the same as disarming. A PR's classification can change
        # under an arming that was right when it was made, so the negative branch has to
        # act rather than do nothing. Unclassified counts as not-safe here too, for the
        # same reason it does above.
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-patch' &&
          steps.metadata.outputs.update-type != 'version-update:semver-minor'
        # Querying first rather than `|| true`: disabling auto-merge that was never armed
        # is an error, and swallowing every error would also swallow a real one.
        run: |
          if [ -n "$(gh pr view "$PR_URL" --json autoMergeRequest -q '.autoMergeRequest // empty')" ]; then
            gh pr merge --disable-auto "$PR_URL"
            echo "auto-merge was armed on a ${{ steps.metadata.outputs.update-type }} — disarmed"
          else
            echo "auto-merge not armed; nothing to disarm"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Say why a major was left alone
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-major' }}
        run: gh pr comment "$PR_URL" --body "Major version bump — left for a human to read the changelog."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
