name: Nightly

# The checks too slow for every push, plus the ones that only mean anything over time.
#
# Each job is independent and none blocks a merge: a nightly that goes red and stays
# red teaches people to ignore it. What it does instead is open a `human-needed` issue,
# so the signal survives the run being scrolled past.
on:
  schedule:
    # 03:17 UTC. Not on the hour: GitHub's scheduler queues heavily at :00 and a
    # free-tier runner can wait twenty minutes for a slot that is not contended.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PYTHONUTF8: "1"
  UV_VERSION: "0.12.20"

jobs:
  secrets-history:
    name: 2MS over full history
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing. 2MS reports a clean exit 0 on a shallow clone
      # even when history contains a secret, and checkout defaults to depth 1 — so the
      # default gives a gate that cannot fail.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
      # The same script the pre-push gate runs. See ci.yml for why this is not a docker
      # invocation written out a second time.
      - name: Scan every branch
        run: bash scripts/hitl/scan-secrets.sh

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      # Coverage says the line ran. Mutation says the test would have noticed if it
      # were wrong, which is the thing this repo actually relies on.
      - name: Mutate the frozen Python oracle
        run: make mutate

      # The TypeScript core, which is the one that ships (ADR-001). Its own run excludes
      # the differential suites: those compare byte-for-byte against the oracle and would
      # kill nearly every mutant, reporting a score that measures the oracle rather than
      # the tests. `if: always()` so one language's result does not hide the other's.
      - name: Mutate packages/core
        if: always()
        run: make mutate-ts

  drift:
    name: Infrastructure drift
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
      issues: write
    environment: diagnostics
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DIAGNOSTICS_ROLE }}
          aws-region: us-east-1
          role-session-name: setlist-drift-${{ github.run_id }}
      # Detection is read-only and free. Someone changing a resource in the console is
      # exactly how a $0 account stops being one, and nothing else here would see it.
      - name: Detect drift on every stack
        run: |
          set -euo pipefail
          for stack in $(aws cloudformation describe-stacks \
              --query "Stacks[?starts_with(StackName, 'setlist-')].StackName" --output text); do
            id=$(aws cloudformation detect-stack-drift --stack-name "$stack" \
                   --query StackDriftDetectionId --output text)
            echo "$stack: detection $id"
          done

  lockfile-age:
    name: Committed lockfile still clears minimumReleaseAge
    runs-on: ubuntu-latest
    # The CI run only asks this when pnpm-lock.yaml moves, which is correct for the
    # common case — publish dates only get older, so a compliant lockfile stays
    # compliant. This nightly run catches the uncommon case that has nothing to do with
    # the lockfile changing: a version being UNPUBLISHED or yanked out from under it,
    # which turns an established age into one that cannot be established at all. That is
    # a supply-chain event, and the check already treats unknown as failure.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile

      # No cache, deliberately. The point of the nightly run is to ask the registry
      # again, and a cached publish date would answer from the very memory this run
      # exists to re-check.
      - name: Every locked version clears minimumReleaseAge
        run: node tools/check_lockfile_maturity.js --no-cache

  resume-dated-work:
    name: Tasks whose not_before has arrived
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
      # A soak period that nobody is reminded about is a soak period that never ends.
      - name: Check the ledger for runnable dated tasks
        id: due
        run: uv run python tools/check_due_tasks.py --format github

      - name: Open a resume issue
        if: steps.due.outputs.due != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const due = process.env.DUE
            const title = 'Resume: dated work is now runnable'
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'human-needed',
            })
            if (existing.data.some(i => i.title === title)) return
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['human-needed'],
              body: `These tasks passed their \`not_before\` date:\n\n${due}\n\nType \`/autopilot\` in Claude Code.`,
            })
        env:
          DUE: ${{ steps.due.outputs.due }}
