name: Sync secrets to SSM

# Provider credentials live in GitHub environment secrets, and the Lambdas need them at
# runtime. This copies them into SSM Parameter Store SecureString — not Secrets Manager,
# which is $0.40 per secret per month and on the never-use list (PED D10-11).
#
# Three properties matter here, and all three are easy to lose:
#
#   * It never prints a value. `aws ssm put-parameter` takes the secret through an
#     environment variable, never an argument — arguments appear in process listings and
#     in `set -x` output, and a workflow log is public on a public repository.
#   * It is dispatch-only. A secret sync on every push is a secret sync nobody is
#     watching.
#   * It writes only under /setlist/<env>/, so a typo cannot overwrite something else.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment's secrets to sync
        type: choice
        options: [dev, stage, prod]
        default: dev
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-secrets-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  sync:
    name: Copy environment secrets into SSM
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_ENABLED == 'true' }}
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1
          role-session-name: setlist-sync-secrets-${{ github.run_id }}

      - name: Put each present secret
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          # GOOGLE_*, not YOUTUBE_*: YouTube's API uses a Google OAuth client, and
          # `scripts/hitl/set-provider-secrets.sh google` is what stores these. Two
          # names for one credential is how a sync silently writes nothing.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          # Generated rather than typed, when the token vault lands (M1). Absent for
          # now, and `put` skips an empty value rather than writing one.
          TOKEN_VAULT_DATA_KEY: ${{ secrets.TOKEN_VAULT_DATA_KEY }}
        run: |
          set -euo pipefail
          # No `set -x` anywhere in this job, and no secret on a command line.

          put() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "skip  /setlist/$ENVIRONMENT/$name (not set for this environment)"
              return
            fi
            # --value "$value" would be visible in a process listing on the runner.
            # The CLI reads file:// without the shell ever holding it as an argument.
            printf '%s' "$value" > /tmp/secret.value
            aws ssm put-parameter \
              --name "/setlist/$ENVIRONMENT/$name" \
              --type SecureString \
              --value "file:///tmp/secret.value" \
              --overwrite \
              --no-cli-pager >/dev/null
            rm -f /tmp/secret.value
            echo "ok    /setlist/$ENVIRONMENT/$name"
          }

          put google/client_id "$GOOGLE_CLIENT_ID"
          put google/client_secret "$GOOGLE_CLIENT_SECRET"
          put spotify/client_id "$SPOTIFY_CLIENT_ID"
          put spotify/client_secret "$SPOTIFY_CLIENT_SECRET"
          put token-vault/data_key "$TOKEN_VAULT_DATA_KEY"

      - name: Confirm what exists, without reading any value
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: |
          set -euo pipefail
          # describe-parameters returns names and metadata only. get-parameter would
          # return the value, and this log is public.
          aws ssm describe-parameters \
            --parameter-filters "Key=Name,Option=BeginsWith,Values=/setlist/$ENVIRONMENT/" \
            --query 'Parameters[].{Name:Name,Type:Type,Modified:LastModifiedDate}' \
            --output table
