name: CI

# Public repo on GitHub Free: standard runners are free, so no self-hosted runners and
# no macOS jobs in the default path.
on:
  pull_request:
  push:
    # ADR-005: Claude Code pushes task/* and fast-forwards develop, so CI has to
    # run on both - a task branch is only integrated once its own run is green.
    branches: [main, develop, 'task/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.20"
  # Match the Makefile. CI is Linux (UTF-8 by default) and local dev is Windows
  # (cp1252), so without this the two disagree about encoding and a bug reproduces
  # in exactly one of them.
  PYTHONUTF8: "1"

jobs:
  quality:
    name: make verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install the pinned toolchains
        run: |
          uv sync --all-packages --frozen
          pnpm install --frozen-lockfile

      # Run the gate itself rather than a copy of its steps. Re-listing ruff, mypy,
      # eslint, tsc and the rest here is how CI and local drift apart: a check added to
      # one and forgotten in the other passes locally and fails in review, or worse,
      # the reverse. `make verify` is the single definition; this runs it.
      - name: make verify
        run: make verify

      - name: Unit tests with coverage gate
        # Not part of `make verify` — coverage instrumentation roughly doubles the
        # runtime, and verify has a sub-5-minute budget it has to keep.
        #
        # The marker filter has to match `make test-unit`'s. Without it this step
        # collects the `local_aws` tests and tries to reach a DynamoDB Local container
        # that only exists in its own job, which is how it failed the first time.
        run: >-
          uv run pytest -m "not integration and not e2e and not local_aws"
          --cov --cov-report=term-missing --cov-report=xml -q

      - name: Core coverage gate (>=90%)
        run: |
          uv run python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          tree = ET.parse("coverage.xml")
          total = covered = 0
          for cls in tree.iter("class"):
              if "setlist_core" not in cls.get("filename", "").replace("\\", "/"):
                  continue
              for line in cls.iter("line"):
                  total += 1
                  covered += int(line.get("hits", "0")) > 0
          pct = 100.0 * covered / total if total else 0.0
          print(f"setlist_core line coverage: {pct:.2f}% ({covered}/{total})")
          if pct < 90.0:
              sys.exit(f"core coverage {pct:.2f}% is below the 90% gate")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  synth:
    name: cdk synth (6 combinations, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # No AWS credentials are configured for this job, deliberately. Synthesis must
      # work offline — a context lookup would call AWS and fail here, which is the
      # point: that is how `fromLookup` creeping in gets caught rather than discovered
      # later on a machine that happens to have credentials.
      - name: Synthesize both profiles across all environments
        run: make synth-matrix

  accuracy:
    name: Extraction accuracy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --frozen
      # Golden-set F1 is a release gate, not a report: a regression fails the PR.
      - run: uv run pytest -m accuracy -q

  secrets:
    name: Secret scanning (2MS)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not tidiness. 2MS reports a CLEAN exit 0 on a
      # shallow clone even when history contains a secret, and actions/checkout defaults
      # to depth 1 — so the default gives a gate that can never fail.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}

      # The same script the pre-push gate runs, rather than a docker invocation written
      # out again here. Two definitions of one security gate drift, and this pair drifted
      # before it ever ran: CI named `checkmarx/2ms:v5.4.0`, an image tag that does not
      # exist — Docker Hub stops at 4.9.0 while the releases are on 5.x. The job failed
      # with "manifest unknown", which at least is loud; a tag that existed but lagged
      # would have been worse.
      #
      # scan-secrets.sh downloads the pinned 5.4.0 binary, verifies its SHA-256 before
      # executing it, scans full history with --all-branches, and fails closed if it
      # cannot run at all.
      - name: 2MS full-history scan
        run: bash scripts/hitl/scan-secrets.sh

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # TypeScript is the default language (ADR-004); Python is the exception. Both
        # are scanned.
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3

  deps:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-packages --frozen
      # Pinned by version, not :latest. A security scanner that changes under you turns
      # an unrelated red build into a mystery, and the usual response to a mystery red
      # is to stop reading it.
      # `--config` is explicit rather than relying on osv-scanner finding the file by
      # walking the tree: a config it silently failed to load would turn every
      # suppression off at once and look exactly like a clean scan that found new
      # findings. The file is GENERATED from security/suppressions.yaml, so nothing can
      # be ignored here without an owner, a reason and an expiry.
      - name: OSV scan
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.2.4 \
            scan source --recursive --config /src/osv-scanner.toml /src

  conformance:
    name: Engine conformance (Node + Chromium)
    runs-on: ubuntu-latest
    # Its own job because it needs a browser, and `make verify` must not: that gate has a
    # five-minute budget and runs without Docker. ADR-001 requires parity on all three
    # engines the core runs on; this covers two of them, and M1-04 adds Hermes using the
    # same exported suite.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Chromium only. The core ships to Android and the web, and a WebKit download buys
      # nothing CORE-06 asks for.
      - name: Install Chromium
        run: pnpm -C packages/core exec playwright install --with-deps chromium

      - name: Node and Chromium agree on the full golden set
        run: pnpm -C packages/core test:conformance

  ocr-golden:
    name: OCR golden images (M2-01)
    runs-on: ubuntu-latest
    # "Images are generated in CI, never committed" is the done_when, and this job is the
    # half that makes it true rather than merely allowed. The repository tracks only the
    # summary in golden/ocr/corpus.json; the 620 images exist because this runs.
    #
    # Its own job for the same reason as conformance above: it needs Chromium, and
    # `make verify` must not. `make golden-check` is the part that lives in the fast gate,
    # and it is pure — it rebuilds the plan and compares the committed summary.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm -C packages/core exec playwright install --with-deps chromium

      # The renderer's own suite: a real JPEG at the planned size, byte-identical on a
      # rerun, and the overflow guard refusing a document whose text does not fit.
      - name: Renderer behaviour
        run: pnpm -C tools/golden-images test:render

      - name: Render the corpus
        run: pnpm -C tools/golden-images exec tsx src/cli.ts

      # Rendering writes the summary too. If what it wrote differs from what is committed,
      # the corpus changed without being regenerated — the same staleness check `make
      # golden-check` runs, asserted here against a run that actually drew the images.
      - name: The committed summary matches what rendering produced
        run: git diff --exit-code -- golden/ocr/corpus.json

      - name: Nothing generated became tracked
        run: |
          if [ -n "$(git status --porcelain -- golden/ocr-generated)" ]; then
            echo "golden/ocr-generated is not ignored — images would be committable"
            git status --porcelain -- golden/ocr-generated
            exit 1
          fi

  mobile-emulator:
    name: Mobile on the emulator (M1-01, M1-07)
    runs-on: ubuntu-latest
    # The only job that proves the product works rather than that its parts do.
    #
    # Everything under mobile/ except the screen itself is a pure function and is gated by
    # `make verify`. What a unit test cannot show is that the identical grammar produces
    # the identical answer on Hermes, on a device, with no server — which is M1-07's whole
    # claim — or that three variants really do install side by side rather than replacing
    # each other, which is FR-M-015.
    #
    # Builds are `expo prebuild` + Gradle, NOT `eas build --local`. The difference is
    # deliberate and incomplete: EAS needs an Expo access token that only a human can
    # create (docs/hitl/SESSION-1.md §7, issue #18), and holding the rest of M1 hostage to
    # that is worse than building debug APKs the open toolchain can produce today. M1-01
    # stays blocked on H1 until the EAS half exists.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Bundle before building, because the bundler is what breaks and Gradle is what is
      # slow. A Metro failure shows up here in about a minute; inside `assembleRelease` it
      # shows up after four, as `:app:createBundleReleaseJsAndAssets FAILED` with the real
      # error forty lines further up. Same pipeline, same resolver, much earlier.
      - name: The app bundles for Hermes
        run: APP_VARIANT=dev pnpm -C mobile exec expo export --platform android --output-dir "$RUNNER_TEMP/bundle-check"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Three variants, three prebuilds, three APKs. `--clean` because the Android
      # project is generated from the config and the application id is the thing that
      # differs — reusing a previous variant's native project would build the same app
      # three times and the side-by-side test would pass for the wrong reason.
      #
      # `assembleRelease`, not `assembleDebug`. A debug APK expects a Metro server to
      # serve its JavaScript, so on an emulator with no server it installs, launches, and
      # shows nothing — which is exactly how the first run failed: all three packages
      # present, and every assertion about the screen false. A release build embeds the
      # bundle. It needs no secret either: Expo's generated `release` block is signed with
      # the debug keystore, which is fine for a build that only ever reaches an emulator
      # and is never distributed.
      - name: Build a release APK for each variant
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apks"
          for variant in dev stage prod; do
            echo "::group::$variant"
            APP_VARIANT="$variant" pnpm -C mobile exec expo prebuild \
              --platform android --clean --no-install
            (cd mobile/android && APP_VARIANT="$variant" ./gradlew --no-daemon assembleRelease)
            cp mobile/android/app/build/outputs/apk/release/app-release.apk \
              "$RUNNER_TEMP/apks/$variant.apk"
            echo "::endgroup::"
          done
          ls -l "$RUNNER_TEMP/apks"

      # Same arrangement as the 2MS binary in scripts/hitl/scan-secrets.sh: a pinned
      # release, its SHA-256 checked before anything executes, and a hard failure if the
      # digest does not match. `curl | bash` from the vendor's install endpoint would
      # execute whatever that endpoint serves today.
      - name: Install Maestro, verifying its checksum
        env:
          MAESTRO_TAG: cli-2.10.0
          MAESTRO_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
        run: |
          set -euo pipefail
          url="https://github.com/mobile-dev-inc/Maestro/releases/download/${MAESTRO_TAG}/maestro.zip"
          curl -fsSL "$url" -o "$RUNNER_TEMP/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          echo "$RUNNER_TEMP/maestro-dist/maestro/bin" >> "$GITHUB_PATH"

      # The emulator needs hardware acceleration to be usable; without this it falls back
      # to software rendering and the flows time out rather than fail.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install all three and drive them
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # `hide_error_dialogs` first, and it is not papering over a crash in this app.
          #
          # The run that failed before this line existed produced a screenshot showing the
          # app rendered CORRECTLY — heading, paste box, "0 songs", the notice — with a
          # "Pixel Launcher isn't responding" dialog on top of it. Maestro reads the window
          # hierarchy, the ANR dialog owns the focused window, and so `paste-input` is
          # genuinely not visible. The failure was real; the cause was the emulator's own
          # launcher, which ANRs on a freshly booted image while three APKs install.
          #
          # This suppresses system crash and ANR dialogs on the emulator only. It cannot
          # hide a failure of ours: an app that crashed would still have no `paste-input`
          # to find, and every assertion below would still fail.
          #
          # One command per line, and no shell constructs that span lines.
          #
          # android-emulator-runner executes this script a LINE AT A TIME, each in its own
          # `sh -c`. A `for ... do ... done` loop therefore dies on its first line with
          # "end of file unexpected", and a `set -eu` on line one applies to a shell that
          # has already exited by line two. The action checks each line's exit code, which
          # is what actually stops the run on a failure.
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb install -r "$RUNNER_TEMP/apks/dev.apk"
            adb install -r "$RUNNER_TEMP/apks/stage.apk"
            adb install -r "$RUNNER_TEMP/apks/prod.apk"
            adb shell pm list packages com.setlist.app
            maestro test mobile/.maestro/variants-side-by-side.yaml
            maestro test mobile/.maestro/paste-to-list.yaml

      - name: Keep the Maestro output when a flow fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests
          if-no-files-found: ignore

  dynamodb-local:
    name: ETL against DynamoDB Local
    runs-on: ubuntu-latest
    # Its own job because it needs a container, and `make verify` must not: that gate has
    # a five-minute budget and runs without Docker. The tests are marked `local_aws`
    # rather than `integration` — `integration` means a deployed dev account, and
    # ADR-005 forbids local AWS credentials, while this needs neither. The container
    # accepts the fake credentials the tests pass it.
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.0.0
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --frozen

      - name: ETL adapters against DynamoDB Local
        run: uv run pytest -m local_aws -q
        env:
          DYNAMODB_LOCAL_ENDPOINT: http://localhost:8000

  resolvable:
    name: Lockfiles resolve under the supply-chain policies
    runs-on: ubuntu-latest
    # Every other job installs with --frozen-lockfile, which replays the lockfile and
    # checks none of the policies that produced it. `minimumReleaseAge`, `trustPolicy`
    # and `blockExoticSubdeps` are resolution-time rules, so anything already locked is
    # grandfathered forever and the settings go on reporting success over a lockfile
    # they would now reject.
    #
    # That is not hypothetical. The lockfile reached a state where `pnpm install` could
    # not run at all — vitest, aws-cdk-lib and typescript-eslint pinned to releases
    # younger than the seven-day cooldown, and `undici-types` sitting on a version whose
    # provenance attestation had lapsed. Every `--frozen-lockfile` install stayed green.
    # What noticed was Dependabot, by dying: its first step is a real resolve, so the
    # dependency automation had quietly stopped being able to propose anything at all.
    #
    # This job is that resolve, run deliberately instead of discovered in a bot's logs.
    #
    # The resolve alone was not enough, and the same thing happened again on 2026-10-01:
    # the lockfile took rolldown 1.2.12 one day after publication against a seven-day
    # floor, Dependabot died on every run for two days, and this job stayed green the
    # whole time — because a fresh resolve keeps picking the mature 1.2.11, so the
    # answer it gives is about a lockfile it just built, not the one in the repository.
    # Hence the maturity check below, which reads the committed artifact.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Needed to diff against the base: the maturity check below only runs when the
          # lockfile actually moved, and a shallow clone cannot answer that.
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Publish dates are immutable, so this cache never goes stale — a version's publish
      # time is not a fact that later changes. The key rolls per run so each run writes
      # back what it learned; `restore-keys` means a new key still starts from the newest
      # previous cache rather than from nothing.
      - name: Restore remembered publish dates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/lockfile-maturity.json
          key: lockfile-maturity-${{ github.run_id }}
          restore-keys: |
            lockfile-maturity-

      - name: Did the lockfile move?
        id: lockfile
        # ADR-011: run the age check when pnpm-lock.yaml changes, and nightly. On every
        # push it would be ~350 registry requests to re-answer a question whose answer
        # cannot have changed — publish dates only get older, so a lockfile that was
        # compliant yesterday is still compliant today unless it moved.
        # Through `env:`, never interpolated into the script. `${{ }}` splices a value in
        # before the shell sees it, so text containing `$(...)` would execute on the
        # runner with whatever token this job holds. Semgrep's run-shell-injection rule
        # caught exactly this here, which is the rule earning its place.
        #
        # To be accurate about which of these is actually dangerous: `base_ref` is the
        # TARGET branch and is ours, so this particular line was not exploitable. The
        # attacker-controlled fields on a fork pull request are `head_ref`, the PR title
        # and body, branch and tag names, commit messages and author fields. The rule is
        # written as "no github.event text in a run: block" rather than "no dangerous
        # fields" because that distinction is exactly the thing nobody re-checks when a
        # line is copied somewhere else.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base=''
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] \
               && [ "$BEFORE_SHA" != '0000000000000000000000000000000000000000' ]; then
            base="$BEFORE_SHA"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # A new branch, a force-push, or a base we cannot see. Unknown means run it:
            # the expensive answer is always safe, the skipped one is not.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "no usable base ref — running the age check"
            exit 0
          fi
          if git diff --name-only "$base" -- pnpm-lock.yaml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "pnpm-lock.yaml changed since $base"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pnpm-lock.yaml unchanged since $base — skipping the age check"
          fi

      # Everything below the fresh resolve asks "could a compliant lockfile exist?".
      # These three steps ask the question that actually bit: "is the committed one
      # compliant?" They run FIRST because the step after this deletes the evidence.
      - name: Install from the committed lockfile
        # Also gives the checker the `yaml` parser, which is a dependency of infra.
        run: pnpm install --frozen-lockfile

      - name: Every locked version clears minimumReleaseAge
        if: steps.lockfile.outputs.changed == 'true'
        run: node tools/check_lockfile_maturity.js

      - name: ...and that check can fail
        if: steps.lockfile.outputs.changed == 'true'
        # A gate nobody has watched fail is a gate nobody has tested. Both directions are
        # time-stable: a floor of a hundred years rejects every real package however old
        # it gets, and a package that does not exist never starts existing.
        run: |
          if node tools/check_lockfile_maturity.js --floor-minutes 52560000; then
            echo "::error::maturity check passed against a 100-year floor; it is not comparing ages"
            exit 1
          fi
          if node tools/check_lockfile_maturity.js \
               --lockfile tests/fixtures/lockfile-maturity/unknown-version.yaml; then
            echo "::error::maturity check passed over a version it could not age; unknown must not mean mature"
            exit 1
          fi
          echo "both must-fail directions failed, as they must"

      - name: Resolve pnpm from nothing
        # The lockfile is deleted first on purpose: with it present pnpm reuses settled
        # resolutions and the policies are never consulted, which is the whole bug.
        # Nothing is committed from here — the checkout is thrown away with the runner.
        #
        # This proves a compliant resolution EXISTS. It cannot prove the committed
        # lockfile is that resolution, because it begins by throwing it away — which is
        # why the maturity check above runs before this point and not after.
        run: |
          rm pnpm-lock.yaml
          pnpm install --lockfile-only

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Resolve uv from nothing
        # The same question for Python, where `exclude-newer` is the cooldown.
        run: |
          rm uv.lock
          uv lock

  sast:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The image rather than the action: the action wants a SEMGREP_APP_TOKEN and
      # reports to a hosted dashboard, and this repository has neither an account nor a
      # budget for one. `--error` is what makes it a gate instead of a report.
      - name: Scan with the default rulesets
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.178.0 \
            semgrep scan --config p/default --config p/typescript --config p/python \
              --config p/secrets --error --quiet --metrics=off

  filesystem-scan:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Covers what OSV does not: misconfiguration in the IaC and licence problems in
      # vendored files. `exit-code: 1` is the difference between a gate and a dashboard.
      #
      # `skip-dirs` holds exactly one glob, and it is a shape rather than a list: the
      # `test/` directory of a KICS query. Those files are templates that violate
      # something on purpose — a bucket with no lifecycle rule, an ECR repository that
      # should not exist — because that is how the KICS query proves it fires. Scanning
      # them finds the violations they were written to contain. They are not scanned by
      # Trivy, they are driven by tools/check_kics_queries.js, which asserts every
      # positive fires and no negative does.
      #
      # tools/check_workflows.js checks this glob against the repository: every
      # directory it matches must be a KICS query's own test directory, and every such
      # directory must be matched. Skipping anything else means writing a query.rego
      # next to it first, which is not something that happens by accident.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: security/kics-queries/*/*/test
          # Generated from security/suppressions.yaml; `make verify` fails if the two
          # disagree. Named rather than left to Trivy's auto-discovery so that a rename
          # is an error instead of a silently empty ignore list.
          trivyignores: .trivyignore.yaml

  hygiene:
    name: Ledger, suppressions, secrets, shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}

      # Everything here is deliberately NOT in `make verify` — either because it needs
      # the full history, or because it needs a tool `verify` must not depend on
      # (verify has to run offline, Docker-free, in under five minutes). The checks
      # verify does run — ledger, links, line endings, suppressions, the guard — are
      # not repeated here; the `quality` job runs them by running verify itself.

      # Complements 2MS: this also catches account ids, ARNs and personal data, which
      # ADR-005 bans from a public repository and most secret scanners ignore. The
      # --history form additionally checks commit author identities, which nothing
      # else looks at. `make verify` runs the cheaper --staged form.
      - name: No secrets, personal data, or undeclared commit identities
        run: uv run python tools/check_no_secrets.py --history


      - name: Shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/hitl/*.sh scripts/ci/*.sh tools/*.sh .claude/hooks/*.sh

      # Syntax, expressions and action inputs.
      - name: Workflow syntax
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      # And the properties actionlint has nothing to say about: SHA pinning, the
      # pull_request_target trap, the fork/AWS gate, and that the kill-switch drill
      # cannot target prod. Also runs in `make verify`, which has no network.
      #
      # It parses YAML rather than grepping, so it needs the `yaml` package — which is
      # why this job installs node modules despite otherwise being a Python-and-shell
      # job. Without it the checker died on `Cannot find module 'yaml'`, which reads as
      # a broken check rather than a clean one, but is a failure either way.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The pin check goes AFTER the install above, which this job already needed. An
      # earlier version added a second pnpm/setup-node pair of its own, and the job
      # failed on a post-step cache save: two setup-node steps in one job means two
      # cache saves, and the loser reports a path that no longer exists.

      # A resolved sha→tag answer is immutable, so this cache never goes stale. It only
      # grows when a pin changes, which is when the check has real work to do anyway.
      - name: Restore resolved action pins
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/action-pins.json
          key: action-pins-${{ github.run_id }}
          restore-keys: |
            action-pins-

      # `make workflows` checks the pin FORMAT offline and runs inside `make verify`.
      # This asks the question format cannot answer: does the SHA exist, and is it the
      # commit its version comment claims? A pin written from memory is forty hex
      # characters and passes every local test there is.
      - name: Pinned action SHAs resolve to the tags they claim
        run: node tools/check_workflows.js --verify-pins
        env:
          # Rate-limit headroom only; the endpoint is public and needs no scope.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Workflow properties
        run: node tools/check_workflows.js

  zero-cost:
    name: Zero-cost guardrails (cdk-nag + KICS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Both directions, for both tools. The real stacks must pass, AND a stack that
      # must be rejected must be rejected — a pack that is never attached, or a query
      # with a Rego error, is silent, and silence here is indistinguishable from
      # compliance.
      - name: cdk-nag, and a NAT gateway that must be blocked
        run: make nag ENV=dev

      # Templates for all three environments under profile=zero, in a directory of
      # their own: KICS scans a path, and leftovers from another run would be scanned
      # as if they were ours.
      - name: Synthesize the zero-profile templates
        run: make cdk-out-zero

      - name: The query pack matches its spec
        run: node tools/gen_kics_queries.js --check

      # Every query against a sample that must be flagged and one that must not. This
      # is what distinguishes a working pack from one that failed to load.
      - name: KICS zero-cost queries discriminate
        run: node tools/check_kics_queries.js

      # The DEFAULT catalog over the templates and these workflow files, covering
      # security issues the zero-cost pack says nothing about — including whether the
      # actions above are pinned, which is why this job scans itself.
      #
      # The pinned image, not Checkmarx/kics-github-action. The action was pinned to
      # v2.1.20 and failed on the runner with
      #   node: /usr/lib/libm.so.6: version `GLIBC_2.44' not found
      # because its container image is older than the Node the runner injects into it.
      # The image has no such problem, is the same thing `make kics` runs locally, and
      # pins a version rather than a tag that moves.
      - name: KICS default catalog
        run: |
          mkdir -p kics-results
          docker run --rm -v "$PWD:/path" checkmarx/kics:v2.1.11 scan \
            -p /path/infra/cdk.out,/path/.github/workflows \
            -o /path/kics-results --report-formats sarif \
            --fail-on high,critical --no-progress --no-color

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kics-sarif
          path: kics-results
          retention-days: 7

# Jobs added as their subjects land:
#   free-tier  — the estimator gate; red until ADR-008 is decided (docs/hitl/QUEUE.md),
#                so it lands with that decision rather than blocking every PR first
#   contracts  — producer golden samples verified by every consumer
#   mobile     — Jest + RNTL, Maestro on an Android emulator, MobSF
#   checkmarx  — Checkmarx One, gated on the CX_ENABLED secret (dormant until licensed)
