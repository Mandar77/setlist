name: Deploy

# develop deploys dev then stage. main deploys prod — and only ever with the artifact
# that already passed stage, never a fresh build of the same source. Two builds of the
# same commit are not the same artifact: a floating dependency, a different runner
# image or a timestamp in a bundle is enough to make prod differ from the thing that
# was tested, and the difference is invisible until it matters.
#
# Nothing here runs without `vars.AWS_ENABLED == 'true'`, which `scripts/hitl/
# github-setup.sh` sets after Session 1. Before that — and on every fork, which never
# inherits repository variables — each job no-ops instead of failing, so a fork's CI is
# green rather than red for a reason its owner cannot fix.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

# Least privilege, and `id-token` is what makes OIDC work at all: without it the role
# assumption below fails with no credentials rather than falling back to anything.
permissions:
  contents: read
  id-token: write

concurrency:
  # Never cancel a deploy in flight. A half-applied CloudFormation change set is a
  # worse state than a queued one.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  AWS_REGION: us-east-1
  JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"

jobs:
  build:
    name: Synthesize once
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_ENABLED == 'true' }}
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # No credentials configured for this step, deliberately: synthesis must stay
      # offline. A context lookup would need AWS and fail here, which is how
      # `fromLookup` creeping in gets caught.
      - name: Synthesize every environment
        run: make cdk-out-zero

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cdkout-${{ github.sha }}
          path: infra/cdk.out
          retention-days: 30
          if-no-files-found: error

  dev:
    name: Deploy dev
    needs: build
    if: ${{ vars.AWS_ENABLED == 'true' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cdkout-${{ github.sha }}
          path: infra/cdk.out

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: setlist-deploy-dev-${{ github.run_id }}

      - name: Deploy from the synthesized assembly
        run: |
          cd infra
          pnpm exec cdk deploy --all --app cdk.out --require-approval never \
            --context env=dev --context profile=zero

  stage:
    name: Deploy stage
    needs: dev
    if: ${{ vars.AWS_ENABLED == 'true' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cdkout-${{ github.sha }}
          path: infra/cdk.out

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: setlist-deploy-stage-${{ github.run_id }}

      - name: Deploy from the synthesized assembly
        run: |
          cd infra
          pnpm exec cdk deploy --all --app cdk.out --require-approval never \
            --context env=stage --context profile=zero

  prod:
    name: Deploy prod
    if: ${{ vars.AWS_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # A protected environment. ADR-005 reserves the merge to main for the human, and
    # this is the second lock on the same door.
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The whole point of this workflow. prod gets the assembly that passed stage, and
      # if there is not one, it stops — it does NOT rebuild. `main` is reached only by
      # merging develop, so the tested assembly is the one built from the develop tip
      # that was merged: the second parent of a merge commit, or the commit itself on a
      # fast-forward.
      - name: Find the assembly that passed stage
        id: assembly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          parents=$(git rev-list --parents -n 1 HEAD)
          merged=$(echo "$parents" | awk '{print ($3 != "" ? $3 : $1)}')
          echo "looking for the stage deploy of $merged"

          run_id=$(gh run list --workflow deploy.yml --branch develop \
            --json databaseId,headSha,conclusion \
            --jq "[.[] | select(.headSha == \"$merged\" and .conclusion == \"success\")][0].databaseId")

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful develop deploy found for $merged." \
                 "prod deploys the artifact that passed stage and never rebuilds."
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$merged" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cdkout-${{ steps.assembly.outputs.sha }}
          path: infra/cdk.out
          run-id: ${{ steps.assembly.outputs.run-id }}
          github-token: ${{ github.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: setlist-deploy-prod-${{ github.run_id }}

      - name: Deploy the assembly that passed stage
        run: |
          cd infra
          pnpm exec cdk deploy --all --app cdk.out --require-approval never \
            --context env=prod --context profile=zero
