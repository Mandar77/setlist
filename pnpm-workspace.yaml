# pnpm workspace members.
#
# Globs rather than an explicit list: a new service must not need a second edit here
# to be built, linted and type-checked. `make verify` walks whatever this resolves to,
# so a package that exists is a package that is gated.
#
# Python lives in a parallel uv workspace (pyproject.toml). The two do not overlap:
# per ADR-004 the only Python is services/ocr, packages/etl and the temporary
# tools/oracle-py, and none of those carries a package.json.

packages:
  - "packages/*"
  - "services/*"
  - "mobile"
  - "web"
  - "infra"
  - "tools/*"
  # Gate fixtures that are real apps rather than test files — tests/fixtures/nat-stack
  # is a CDK app `make nag` runs and requires to FAIL. It needs its own resolvable
  # aws-cdk-lib: pnpm hoists nothing, so a package outside infra/ cannot see infra's
  # dependencies, and the symptom is a crash that reads as the gate firing.
  - "tests/fixtures/*"
# Supply-chain settings. Every one of these is a default that should have been the
# other way round, and Semgrep's package-manager rules flagged all three.
#
# `minimumReleaseAge` is the one that earns its keep. The npm compromises that matter
# are caught within hours — a maintainer account is taken over, a malicious version is
# published, it is yanked the same day. Waiting 10080 minutes (seven days) before any
# newly published version is resolvable means this repository simply never sees that
# window. The cost is that an urgent legitimate patch is also a week late, which is the
# right trade for a project with no users yet.
#
# It binds at resolution time only. A version already in the lockfile is replayed by
# `--frozen-lockfile` without being re-checked, so this setting cannot notice that the
# lockfile has drifted out of compliance with it — the `resolvable` job in ci.yml is
# what notices, by resolving from nothing.
minimumReleaseAge: 10080

# Refuse a version that downgrades its own security settings — the shape of a malicious
# update that quietly turns protections off.
trustPolicy: no-downgrade

# One package has to be forced forward to satisfy the policy above.
#
# `@types/node` on the 22 line asks for `undici-types ~6.20.0`, and neither 6.20.0 nor
# 6.21.0 carries a provenance attestation while earlier-published versions of that
# package did. pnpm reads that as a trust downgrade and refuses to resolve it, which is
# correct and which made the whole workspace unresolvable from scratch — `pnpm install`
# could not run at all, and Dependabot, whose first step is exactly that, stopped being
# able to open a PR for anything.
#
# 6.23.0 is the first release back on provenance. This moves a dependency FORWARD to a
# better-attested version rather than carving out an exception, so the guardrail still
# applies to everything including this package: if 6.23.0 ever loses its attestation the
# resolve fails again. It is type declarations only, so `tsc --build` is the test.
#
# Delete this the day @types/node 22.x ships a dependency on 6.23.0 or later.
# `qs` arrives three levels down from Stryker — @stryker-mutator/core depends on
# typed-rest-client, which depends on qs — and 6.15.1 carries three MEDIUM CVEs
# (GHSA-4mjr-xmp4-gh2g, GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx), all fixed in 6.16.0.
#
# Same shape as the override above and the same justification: it moves a dependency
# FORWARD to a fixed version rather than suppressing a finding. Nothing in this repo
# calls `qs` — it is a transitive dependency of a mutation-testing tool that never runs
# in production — but a dependency scan that has an exception list is a dependency scan
# nobody reads.
#
# Delete this once typed-rest-client ships a dependency on 6.16.0 or later.
# `semver` arrives four levels down from the Expo app — expo -> @expo/metro-config ->
# @babel/core -> semver ^6.3.1 — and no 6.x release carries a provenance attestation,
# while every 7.5.1 and later does. pnpm reads 6.3.1 as a trust downgrade and refuses to
# resolve it, which is correct: judged on publish dates alone, a package whose earlier
# siblings were attested and whose current version is not has the shape of a takeover.
#
# 6.3.1 is in fact the last 6.x and dates from 2023, so this is the familiar false
# positive rather than an incident — but the gate cannot tell those apart, and the way
# through is the same as for undici-types and qs above: move FORWARD to a version that
# satisfies the policy, so the guardrail still applies to this package. semver 7 is API
# compatible for everything Babel calls.
#
# Delete this once @babel/core depends on semver 7.
# `uuid` 7.0.3 comes in under the Expo CLI and carries GHSA-w5hq-g745-h8pq (7.5, a
# missing buffer bounds check in v3/v5/v6 when a `buf` is supplied), fixed in 11.1.1.
# Same shape as the three above: forward to the fixed version rather than an entry in
# security/suppressions.yaml, because a fix exists and a suppression should be reserved
# for the findings where one does not.
overrides:
  undici-types: '6.23.0'
  qs: '6.16.0'
  semver: '7.8.5'
  uuid: '11.1.1'

# Sub-dependencies resolved from a git URL, a tarball or a local path rather than the
# registry. Legitimate uses exist; none of them are here, and each is a way to pull in
# code the lockfile's integrity hashes do not cover.
blockExoticSubdeps: true

# Postinstall scripts, decided explicitly rather than left to a default.
#
# pnpm blocks dependency build scripts unless named here, which is the right default
# for a repo that runs `pnpm install` in CI: a postinstall script is arbitrary code
# execution at dependency-resolution time.
#
# esbuild is allowed because it genuinely needs one — it downloads its platform binary
# — and because Vitest cannot run without it. Everything else stays blocked. Adding a
# line here is a supply-chain decision and should be reviewed as one.
allowBuilds:
  esbuild: true
  # false, and checked rather than assumed: tesseract.js's only install script is
  # `opencollective-postinstall || true`, a donation banner. It is not a build, the `||
  # true` means it can never fail the install, and the OCR engine works without it — the
  # WASM core arrives as the ordinary `tesseract.js-core` dependency, covered by the
  # lockfile's integrity hashes like everything else.
  #
  # Written out because pnpm leaves a placeholder here demanding an answer, and "it
  # installed fine with false" is the kind of reasoning that silently becomes "true"
  # the next time someone hits a confusing error.
  tesseract.js: false
