# Setlist account bootstrap.
#
# GENERATED from infra/bootstrap/template.ts. Do not edit this file: run
#   pnpm -C infra exec tsx bootstrap/generate.ts
# and commit the result. `make preflight` fails if the two disagree.
#
# Generated rather than hand-written because the deny list below has to be checked
# against infra/free-tier/budget.yaml, and a test that parsed CloudFormation
# shorthand to do it would be testing a YAML parser as much as a policy.
#
# Upload this in the CloudFormation console — see docs/hitl/SESSION-1.md section 4.
# It contains no account id, ARN or email: all three are parameters.
AWSTemplateFormatVersion: 2010-09-09
Description: Setlist account bootstrap — GitHub OIDC trust, per-environment deploy roles, the zero-cost permission boundary, and the billing guardrails. Uploaded by hand once (docs/hitl/SESSION-1.md §4); everything after it is deployed by CI.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: GitHub repository that may deploy
        Parameters:
          - GitHubOwner
          - GitHubRepo
          - CreateOidcProviderParam
      - Label:
          default: Billing alerts
        Parameters:
          - AlertEmail
          - ZeroSpendThresholdUsd
          - ForecastThresholdUsd
    ParameterLabels:
      GitHubOwner:
        default: Your GitHub username or organisation
      GitHubRepo:
        default: Repository name (setlist)
      AlertEmail:
        default: Where billing alerts go — you must confirm the email
      CreateOidcProviderParam:
        default: Create the GitHub OIDC provider? No if the account already has one
      ZeroSpendThresholdUsd:
        default: Actual spend that trips the IAM deny (USD)
      ForecastThresholdUsd:
        default: Forecast spend that arms the manual deny (USD)
  SetlistNeverUse:
    DeniedByThisBoundary:
      - Enforces: NAT Gateway
        Why: NAT gateways bill $0.045/hour with no free tier — about $32/month for existing.
        Actions:
          - ec2:CreateNatGateway
      - Enforces: EC2|RDS|ELB
        Why: EC2, RDS and load balancers bill by the hour whether or not anything uses them.
        Actions:
          - ec2:RunInstances
          - rds:CreateDBInstance
          - rds:CreateDBCluster
          - elasticloadbalancing:CreateLoadBalancer
      - Enforces: Lambda VpcConfig
        Why: A VPC-attached function needs an ENI, and egress from it needs a NAT gateway.
        Actions:
          - lambda:CreateFunction
          - lambda:UpdateFunctionConfiguration
      - Enforces: provisioned concurrency
        Why: Billed hourly AND removes the function from the always-free Lambda allowance.
        Actions:
          - lambda:PutProvisionedConcurrencyConfig
      - Enforces: ECR
        Why: ECR storage is billed per GB-month after the first year, and images are large.
        Actions:
          - ecr:CreateRepository
      - Enforces: KMS::Key|KMS CMK|customer-managed
        Why: A customer-managed key is $1/month before a single request (PED D7).
        Actions:
          - kms:CreateKey
      - Enforces: Secrets Manager
        Why: $0.40 per secret per month; SSM Parameter Store standard tier is free (PED D10-11).
        Actions:
          - secretsmanager:CreateSecret
      - Enforces: WAFv2
        Why: $5/month per web ACL plus $1 per rule. Prod gets WAF free with CloudFront (PED D2).
        Actions:
          - wafv2:CreateWebACL
          - wafv2:CreateRuleGroup
          - waf:CreateWebACL
      - Enforces: Route 53
        Why: $0.50 per hosted zone per month plus queries; the CloudFront domain is free.
        Actions:
          - route53:CreateHostedZone
      - Enforces: API Gateway
        Why: Credits-only on a post-2025-07-15 account. Function URLs behind CloudFront are free (PED D1).
        Actions:
          - apigateway:POST
          - apigateway:PUT
      - Enforces: EventBridge buses
        Why: Custom bus events are $1/million with no free tier at all (PED D3).
        Actions:
          - events:CreateEventBus
      - Enforces: SQS event source mappings
        Why: An idle poller makes ~130k requests/month doing nothing (PED D5). Under profile=zero nothing uses an event source mapping, so this is a blanket deny.
        Actions:
          - lambda:CreateEventSourceMapping
      - Enforces: PITR
        Why: $0.20 per GB-month of continuous backup, never covered by the free tier.
        Actions:
          - dynamodb:UpdateContinuousBackups
      - Enforces: Glue jobs
        Why: No Glue option reaches $0; the Data Catalog is free and is all this project uses (PED D8).
        Actions:
          - glue:CreateJob
          - glue:StartJobRun
          - glue:CreateCrawler
          - glue:StartCrawler
      - Enforces: Synthetics
        Why: Billed per canary run, and each one eats the 10-metric and 10-alarm allowances.
        Actions:
          - synthetics:CreateCanary
      - Enforces: FIS, Textract, Bedrock
        Why: All billed per call or per token with no free tier on a post-2025-07-15 account. CloudWatch GetMetricData and Logs Insights queries are billed per call too (CLAUDE.md).
        Actions:
          - bedrock:*
          - textract:*
          - rekognition:*
          - comprehend:*
          - athena:*
          - fis:*
          - ses:*
          - ce:GetCostAndUsage
          - ce:GetCostForecast
          - cloudwatch:GetMetricData
          - logs:StartQuery
    NotExpressibleInIam:
      - Enforces: Express state machines
        Why: "`states:CreateStateMachine` carries no condition key for the workflow type, so IAM cannot tell Standard from Express."
        CoveredBy: SZC-SFN-EXPRESS
      - Enforces: PAY_PER_REQUEST
        Why: Billing mode is a property of the table, and `dynamodb:CreateTable` has no condition key for it.
        CoveredBy: SZC-DDB-ONDEMAND
      - Enforces: log groups without retention
        Why: Retention is set by a separate call after creation; denying creation would ban logging entirely.
        CoveredBy: SZC-LOG-RETENTION
      - Enforces: buckets without lifecycle
        Why: A lifecycle rule is a separate call after creation; denying `s3:CreateBucket` would ban storage entirely.
        CoveredBy: SZC-S3-LIFECYCLE
      - Enforces: alarms
        Why: A per-account count is not something a policy evaluating one request can know.
        CoveredBy: SZC-ALARM-BUDGET
Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns the repository.
    AllowedPattern: ^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$
    ConstraintDescription: "A GitHub username: letters, digits and single hyphens."
  GitHubRepo:
    Type: String
    Default: setlist
    Description: Repository name. Only this repository can assume the deploy roles.
    AllowedPattern: ^[A-Za-z0-9._-]{1,100}$
  AlertEmail:
    Type: String
    Description: Billing alerts are sent here. AWS emails a confirmation link — until you click it the subscription is pending and the alarm fires into a void.
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    ConstraintDescription: Must be an email address.
  CreateOidcProviderParam:
    Type: String
    Default: Yes
    AllowedValues:
      - Yes
      - No
    Description: An account can hold only one provider per URL. Choose No if this account already trusts GitHub Actions, or the stack fails with EntityAlreadyExists.
  ZeroSpendThresholdUsd:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Actual monthly spend that trips the automatic IAM deny. AWS Budgets rejects a limit below 1 USD, so the notification fires at 1% of it — a cent.
  ForecastThresholdUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Forecast monthly spend that arms the manual deny and emails you.
Conditions:
  CreateOidcProvider:
    Fn::Equals:
      - Ref: CreateOidcProviderParam
      - Yes
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
      Tags:
        - Key: app
          Value: setlist
  ZeroCostBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: setlist-zero-cost-boundary-${AWS::Region}
      Description: "Permission boundary for every Setlist role. Denies the never-use list in infra/free-tier/budget.yaml. The last line of defence: cdk-nag and KICS run in CI and can be skipped; this cannot."
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowEverythingNotDeniedBelow
            Effect: Allow
            Action: "*"
            Resource: "*"
          - Sid: DenyNeverUseServices
            Effect: Deny
            Action:
              - apigateway:POST
              - apigateway:PUT
              - athena:*
              - bedrock:*
              - ce:GetCostAndUsage
              - ce:GetCostForecast
              - cloudwatch:GetMetricData
              - comprehend:*
              - dynamodb:UpdateContinuousBackups
              - ec2:CreateNatGateway
              - ec2:RunInstances
              - ecr:CreateRepository
              - elasticloadbalancing:CreateLoadBalancer
              - events:CreateEventBus
              - fis:*
              - glue:CreateCrawler
              - glue:CreateJob
              - glue:StartCrawler
              - glue:StartJobRun
              - kms:CreateKey
              - lambda:CreateEventSourceMapping
              - lambda:PutProvisionedConcurrencyConfig
              - logs:StartQuery
              - rds:CreateDBCluster
              - rds:CreateDBInstance
              - rekognition:*
              - route53:CreateHostedZone
              - secretsmanager:CreateSecret
              - ses:*
              - synthetics:CreateCanary
              - textract:*
              - waf:CreateWebACL
              - wafv2:CreateRuleGroup
              - wafv2:CreateWebACL
            Resource: "*"
          - Sid: DenyNeverUseConditional0
            Effect: Deny
            Action:
              - lambda:CreateFunction
              - lambda:UpdateFunctionConfiguration
            Resource: "*"
            Condition:
              "Null":
                lambda:VpcIds: "false"
          - Sid: DenyRoleCreationWithoutThisBoundary
            Effect: Deny
            Action:
              - iam:CreateRole
              - iam:CreateUser
            Resource: "*"
            Condition:
              StringNotEquals:
                iam:PermissionsBoundary:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/setlist-zero-cost-boundary-${AWS::Region}
          - Sid: DenyBoundaryTampering
            Effect: Deny
            Action:
              - iam:DeleteRolePermissionsBoundary
              - iam:DeleteUserPermissionsBoundary
              - iam:CreatePolicyVersion
              - iam:DeletePolicy
              - iam:SetDefaultPolicyVersion
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/setlist-zero-cost-boundary-${AWS::Region}
          - Sid: DenyOrganizationMembership
            Effect: Deny
            Action:
              - organizations:*
              - account:PutAlternateContact
              - account:CloseAccount
            Resource: "*"
  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: setlist-deploy-${AWS::Region}
      Description: What CI may do when deploying Setlist. Bounded by the zero-cost boundary.
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: CloudFormationAndTheServicesWeUse
            Effect: Allow
            Action:
              - cloudformation:*
              - cloudfront:*
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:GetMetricStatistics
              - cloudwatch:PutMetricAlarm
              - cloudwatch:PutMetricData
              - dynamodb:*
              - lambda:*
              - logs:*
              - s3:*
              - sns:*
              - sqs:*
              - ssm:*
              - states:*
              - tag:*
              - xray:*
            Resource: "*"
          - Sid: RolesForTheStacksOnly
            Effect: Allow
            Action:
              - iam:*
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/setlist-*
              - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/setlist-*
          - Sid: ReadIdentity
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
              - iam:GetRole
              - iam:ListRoles
              - iam:GetPolicy
            Resource: "*"
  DeployRoleDev:
    Type: AWS::IAM::Role
    Properties:
      RoleName: setlist-deploy-dev
      Description: Assumed by GitHub Actions from the 'dev' environment. No long-lived keys exist.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  Fn::Sub: repo:${GitHubOwner}/${GitHubRepo}:environment:dev
      ManagedPolicyArns:
        - Ref: DeployPolicy
      PermissionsBoundary:
        Ref: ZeroCostBoundary
      Tags:
        - Key: app
          Value: setlist
        - Key: env
          Value: dev
  DeployRoleStage:
    Type: AWS::IAM::Role
    Properties:
      RoleName: setlist-deploy-stage
      Description: Assumed by GitHub Actions from the 'stage' environment. No long-lived keys exist.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  Fn::Sub: repo:${GitHubOwner}/${GitHubRepo}:environment:stage
      ManagedPolicyArns:
        - Ref: DeployPolicy
      PermissionsBoundary:
        Ref: ZeroCostBoundary
      Tags:
        - Key: app
          Value: setlist
        - Key: env
          Value: stage
  DeployRoleProd:
    Type: AWS::IAM::Role
    Properties:
      RoleName: setlist-deploy-prod
      Description: Assumed by GitHub Actions from the 'prod' environment. No long-lived keys exist.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  Fn::Sub: repo:${GitHubOwner}/${GitHubRepo}:environment:prod
      ManagedPolicyArns:
        - Ref: DeployPolicy
      PermissionsBoundary:
        Ref: ZeroCostBoundary
      Tags:
        - Key: app
          Value: setlist
        - Key: env
          Value: prod
  DiagnosticsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: setlist-diagnostics
      Description: "Read-only. ADR-005 forbids local AWS credentials, so this is how deployed state is inspected: by dispatching the diagnostics workflow."
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  Fn::Sub: repo:${GitHubOwner}/${GitHubRepo}:environment:diagnostics
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess
      PermissionsBoundary:
        Ref: ZeroCostBoundary
      Policies:
        - PolicyName: deny-billed-reads
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: DenyBilledReadOperations
                Effect: Deny
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - cloudwatch:GetMetricData
                  - logs:StartQuery
                Resource: "*"
      Tags:
        - Key: app
          Value: setlist
  BillingTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: setlist-billing-alerts
      DisplayName: Setlist billing
      Subscription:
        - Endpoint:
            Ref: AlertEmail
          Protocol: email
      Tags:
        - Key: app
          Value: setlist
  BillingTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - Ref: BillingTopic
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowBudgetsToPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: SNS:Publish
            Resource:
              Ref: BillingTopic
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
          - Sid: AllowCostAnomalyDetectionToPublish
            Effect: Allow
            Principal:
              Service: costalerts.amazonaws.com
            Action: SNS:Publish
            Resource:
              Ref: BillingTopic
  SpendStopPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName:
        Fn::Sub: setlist-spend-stop-${AWS::Region}
      Description: "Attached to the deploy roles by a budget action when spend appears. Denies creating anything new while leaving reads and deletes alone: the point is to stop the bleeding without blocking the cleanup."
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: StopCreatingThings
            Effect: Deny
            NotAction:
              - cloudformation:Delete*
              - cloudformation:Describe*
              - cloudformation:List*
              - dynamodb:Delete*
              - dynamodb:Describe*
              - lambda:Delete*
              - lambda:Get*
              - lambda:List*
              - logs:Delete*
              - logs:Describe*
              - s3:Delete*
              - s3:Get*
              - s3:List*
              - sns:Delete*
              - sns:Get*
              - sns:List*
              - sqs:Delete*
              - sqs:Get*
              - sqs:List*
              - sts:GetCallerIdentity
            Resource: "*"
  BudgetActionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: setlist-budget-action
      Description: Assumed by AWS Budgets to attach the spend-stop policy.
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
      Policies:
        - PolicyName: attach-spend-stop
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/setlist-deploy-*
      PermissionsBoundary:
        Ref: ZeroCostBoundary
  ZeroSpendBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: setlist-zero-spend-actual
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount:
            Ref: ZeroSpendThresholdUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 1
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address:
                Ref: BillingTopic
  ZeroSpendAction:
    Type: AWS::Budgets::BudgetsAction
    Properties:
      BudgetName: setlist-zero-spend-actual
      NotificationType: ACTUAL
      ActionType: APPLY_IAM_POLICY
      ApprovalModel: AUTOMATIC
      ExecutionRoleArn:
        Fn::GetAtt:
          - BudgetActionRole
          - Arn
      ActionThreshold:
        Value: 1
        Type: PERCENTAGE
      Definition:
        IamActionDefinition:
          PolicyArn:
            Ref: SpendStopPolicy
          Roles:
            - setlist-deploy-dev
            - setlist-deploy-stage
            - setlist-deploy-prod
      Subscribers:
        - Type: SNS
          Address:
            Ref: BillingTopic
    DependsOn:
      - ZeroSpendBudget
      - DeployRoleDev
      - DeployRoleStage
      - DeployRoleProd
  ForecastBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: setlist-forecast
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount:
            Ref: ForecastThresholdUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address:
                Ref: BillingTopic
  ForecastAction:
    Type: AWS::Budgets::BudgetsAction
    Properties:
      BudgetName: setlist-forecast
      NotificationType: FORECASTED
      ActionType: APPLY_IAM_POLICY
      ApprovalModel: MANUAL
      ExecutionRoleArn:
        Fn::GetAtt:
          - BudgetActionRole
          - Arn
      ActionThreshold:
        Value: 100
        Type: PERCENTAGE
      Definition:
        IamActionDefinition:
          PolicyArn:
            Ref: SpendStopPolicy
          Roles:
            - setlist-deploy-dev
            - setlist-deploy-stage
            - setlist-deploy-prod
      Subscribers:
        - Type: SNS
          Address:
            Ref: BillingTopic
    DependsOn:
      - ForecastBudget
      - DeployRoleDev
      - DeployRoleStage
      - DeployRoleProd
  AnomalyMonitor:
    Type: AWS::CE::AnomalyMonitor
    Properties:
      MonitorName: setlist-all-services
      MonitorType: DIMENSIONAL
      MonitorDimension: SERVICE
  AnomalySubscription:
    Type: AWS::CE::AnomalySubscription
    Properties:
      SubscriptionName: setlist-anomalies
      Frequency: IMMEDIATE
      MonitorArnList:
        - Ref: AnomalyMonitor
      Subscribers:
        - Type: SNS
          Address:
            Ref: BillingTopic
      ThresholdExpression: '{"Dimensions":{"Key":"ANOMALY_TOTAL_IMPACT_ABSOLUTE","MatchOptions":["GREATER_THAN_OR_EQUAL"],"Values":["1"]}}'
Outputs:
  DeployRoleArnDev:
    Description: Set as the AWS_DEPLOY_ROLE secret on the dev GitHub environment.
    Value:
      Fn::GetAtt:
        - DeployRoleDev
        - Arn
  DeployRoleArnStage:
    Description: Set as the AWS_DEPLOY_ROLE secret on the stage GitHub environment.
    Value:
      Fn::GetAtt:
        - DeployRoleStage
        - Arn
  DeployRoleArnProd:
    Description: Set as the AWS_DEPLOY_ROLE secret on the prod GitHub environment.
    Value:
      Fn::GetAtt:
        - DeployRoleProd
        - Arn
  DiagnosticsRoleArn:
    Description: Set as AWS_DIAGNOSTICS_ROLE on the diagnostics GitHub environment.
    Value:
      Fn::GetAtt:
        - DiagnosticsRole
        - Arn
  BoundaryArn:
    Description: The permission boundary every Setlist role must carry.
    Value:
      Ref: ZeroCostBoundary
  BillingTopicArn:
    Description: Confirm the email subscription on this topic before trusting alerts.
    Value:
      Ref: BillingTopic
