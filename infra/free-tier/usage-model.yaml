# Unit cost model (PED S10.8).
#
# `tools/free-tier-estimate` multiplies these by the projected volumes below and
# checks the result against budget.yaml. Every number is either measured or marked
# `estimated` - an estimate that survives to GA unmeasured is a bill waiting to happen.
#
# A nightly job compares these against CloudWatch actuals and flags >25% drift.

version: 1

# Volumes below are monthly; `days_per_month` converts them for the quotas that reset
# daily (YouTube) and the allowances expressed as a rate (DynamoDB capacity). Stated
# here rather than assumed in the estimator so the conversion is visible next to the
# numbers it applies to.
days_per_month: 30

# Which allowance each metric draws down.
#
# The estimator refuses to run if an operation carries a metric that is not listed
# here. A new cost that nobody mapped would otherwise be counted as zero, and a
# forecast that silently ignores a cost is worse than no forecast - it reads as
# headroom.
#
# `limit` names an entry in budget.yaml (limits or provider_limits); `cloudfront` means
# the metric is reported against the `cloudfront:` block there instead, which is not
# split the same way.
meters:
  lambda_requests: { limit: lambda_requests }
  lambda_gb_seconds: { limit: lambda_gb_seconds }
  dynamodb_wcu_ops: { limit: dynamodb_wcu }
  dynamodb_rcu_ops: { limit: dynamodb_rcu }
  sns_publishes: { limit: sns_publishes }
  xray_traces: { limit: xray_traces }
  kms_requests: { limit: kms_requests }
  cloudwatch_logs_gb: { limit: cloudwatch_logs_gb }
  youtube_units: { limit: youtube_units_per_day }
  youtube_search_list: { limit: youtube_search_list_per_day }
  cloudfront_requests: { cloudfront: requests }

# Cost of one unit of work, per flow.
operations:
  on_device_scan:
    description: Scan parsed entirely on the device; only text and spans are uploaded.
    lambda_requests: 3
    lambda_gb_seconds: 0.5
    dynamodb_wcu_ops: 2
    sns_publishes: 3
    cloudfront_requests: 20
    confidence: estimated       # measure at M2

  server_ocr_page:
    description: One page through ocr-svc when on-device confidence < 0.6.
    lambda_requests: 1
    lambda_gb_seconds: 10.0
    cloudfront_requests: 2
    confidence: estimated       # measure at M2; gate is <=12 GB-s/page
    note: 2048 MB function, ONNX PP-OCR, image held in memory and discarded.

  playlist_job_15_songs:
    description: Extraction through to a created YouTube playlist.
    lambda_requests: 12
    lambda_gb_seconds: 8.0
    dynamodb_wcu_ops: 20
    dynamodb_rcu_ops: 35
    sns_publishes: 8
    youtube_units: 800          # 50 (playlists.insert) + 15 * 50 (playlistItems.insert)
    youtube_search_list: 4      # only when ISRC resolution fails
    xray_traces: 1
    confidence: estimated       # measure at M4

  review_session:
    description: A user correcting low-confidence items before creation.
    lambda_requests: 6
    lambda_gb_seconds: 1.0
    cloudfront_requests: 15
    confidence: estimated

# ---------------------------------------------------------------- ADR-008 is open
#
# These three numbers are what ADR-008 decides, and they live here - defined once, as
# anchors - so the decision is a one-line edit each rather than a hunt.
#
# The conflict, in one line: a 15-song playlist costs 50 + 15*50 = 800 YouTube units, so
# prod's 7,000/day buys ~8 a day, which is ~250 a month - and 250 a month is 95.2% of the
# allowance against a gate set at 70%. PED S11 sized prod at 250 BECAUSE that is what the
# quota buys, so the volume target and the gate cannot both stand. Dev is worse and is a
# plain bug rather than a conflict: 500 units a day against 800 for one playlist means dev
# cannot create a single playlist.
#
# Nothing here has been edited to make `make estimate` pass. It exits 1 on seven rows and
# that is the accurate state - the gate working, not the tool failing (AUTOPILOT S2.4).
# Everything that does not depend on the outcome is finished and shipped around it.
#
# `tools/free-tier-estimate/test/adr-008-single-source.test.ts` asserts each of these
# appears exactly once as a literal, so the next edit cannot quietly spread them back out.
adr008_playlists_per_month:
  prod: &adr008_prod_playlists 250 # capped by YouTube units, not by us
  stage: &adr008_stage_playlists 50
  dev: &adr008_dev_playlists 30

# Projected monthly volume per environment. These drive the CI gate, so they are
# deliberately pessimistic: under-forecasting is the only direction that costs money.
volumes:
  prod:
    on_device_scan: 30000
    server_ocr_page: 6000 # 20% fallback rate
    playlist_job_15_songs: *adr008_prod_playlists
    review_session: 8000
  stage:
    on_device_scan: 2000
    server_ocr_page: 400
    playlist_job_15_songs: *adr008_stage_playlists
    review_session: 500
  dev:
    on_device_scan: 1000
    server_ocr_page: 200
    playlist_job_15_songs: *adr008_dev_playlists
    review_session: 200

# Fixed monthly overheads independent of traffic.
baseline:
  prod: { cloudwatch_logs_gb: 2.0, xray_traces: 5000, kms_requests: 3000 }
  stage: { cloudwatch_logs_gb: 0.5, xray_traces: 1000, kms_requests: 1000 }
  dev: { cloudwatch_logs_gb: 0.3, xray_traces: 500, kms_requests: 1000 }
