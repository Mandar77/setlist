- id: CORE-05
  milestone: CORE
  title: Orientation resolution, parser side (ADR-002)
  deps: [CORE-04]
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - the four-step ladder is implemented - explicit cues, document convention, source-kind prior, alternate below 0.8
    - sourceKind added to the ingestion contract and threaded through
    - parser-only orientation accuracy at least 90% on bare-dash lines in the generated set
    - the 8 original golden cases keep their expected outputs unchanged
    - alternate readings carry spans that still pass grounding
  verify: pnpm -C packages/core test
  # DOING. The ladder itself is built, exported and tested; what is left is wiring it to
  # the dash parser, emitting the alternate reading with its span, and measuring the 90%
  # accuracy figure on the generated bare-dash lines.
  evidence:
    - "packages/core/src/orientation.ts implements all four ADR-002 rungs: explicit cues at 0.95, document convention at 0.85, source-kind prior at 0.60, and the alternate below 0.8. 26 tests"
    - "the design decision that makes this possible at all: the ladder is gated on `sourceKind`, which ADR-002 ADDS to the ingestion contract and the frozen oracle has never had. The oracle reads text on stdin and nothing else, so a document built without a sourceKind gets no verdict and behaves exactly as today. That is what keeps ADR-001's differential measuring the port rather than the feature, and keeps golden/diff-allowlist.yaml empty - verified, `make verify` green with all 8 golden cases and 10,000 digests unchanged"
    - "rung 2 carries the weight, as the ADR predicted: repetitionSignal counts distinct FOLDED values per side, and the side with fewer distinct values is the artist, because a real tracklist repeats its artist and not its titles. Folded so `OASIS ` and `Oasis` are one artist - the same key the deduper uses"
    - "each rung is tested for what it REFUSES as well as what it decides: contradicting cues fall through rather than picking one, a single line has no convention, and neither-side-repeats returns null instead of guessing. A ladder whose lower rungs fire when a higher one should have looks identical to a working one on the easy cases"
    - "the alternate threshold is asserted as a PROPERTY - prior < 0.8 <= convention < explicit - so moving any one of the three numbers without the others breaks a test rather than silently changing which documents get a second reading"
    - "sourceKind threaded through extractDeterministic; orientation-pass.ts builds the observations from the parser's own output and rewrites the dash matches that disagree with the document-level verdict. The verdict rides on ExtractionResult so matching can see the basis and confidence, which ADR-002 step 5 needs"
    - "only DASH matches are rewritten. A `by` line, a quoted title and a CSV header state their own orientation - they are rung-1 cues, they drive the verdict, and rewriting them from a document-level statistic would be overruling the document with an average of itself"
    - "ACCURACY 95.3% (142/149) on the 25 bare-dash cases, against the 90% floor. Guarded two ways: a control asserts the corpus is non-empty, because 0/0 would read as 100%, and a second test asserts the ladder ACTUALLY decided these - without it the number would pass even if the pass were a no-op, since the artist-first parser default happens to be right for this corpus"
    - "the alternate reading is attached below 0.8 and shares the item's span, which is what makes it usable: swapping which side is the title moves no offset, so both readings are grounded in the same text and ADR-007 holds for each. Proven - spans identical before and after, zero rejected"
    - "FOUND BY THE TESTS: the first version let rungs 1 and 2 fire without a sourceKind, which is what ADR-002 literally describes, and four pipeline tests broke instantly. The oracle has no source kind, so `the ladder may fire on evidence alone` means `the port answers differently from the oracle on inputs the oracle can express`. The whole pass is now gated on sourceKind - stricter than the ADR, and the only version that keeps ADR-001's differential measuring the port"
    - "differential intact: 736 core tests, `make verify` green over the 8 golden cases and 4,900 normalize records, 10,000 pipeline digests current, golden/diff-allowlist.yaml still empty"

- id: CORE-06
  milestone: CORE
  title: Engine conformance on Node and Chromium
  deps: [CORE-04]
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - identical outputs for the full golden set on Node (Vitest) and Chromium (Playwright)
    - NFKC and regex Unicode property escape behaviour asserted explicitly on both
    - the conformance suite is a reusable export, so M1-04 can run it on Hermes
  verify: pnpm -C packages/core test:conformance
  evidence:
    - "src/conformance.ts is the suite and it is PURE - cases in, report out, no filesystem. That is what makes the ADR-001 claim checkable: a suite that read golden/ with node:fs could only ever run in one of the three engines it is supposed to compare"
    - "Node runner reads golden/oracle and calls it; the Chromium runner bundles the SAME module with esbuild and evaluates it in a Playwright page, so both engines run identical code rather than two implementations that agree. 18 tests, all 8 frozen oracle outputs reproduced in both"
    - "exported from packages/core so M1-04's Hermes self-test screen imports the same function - the reusable-export done_when, and the engine where ADR-001 actually expects divergence"
    - "NFKC and regex property escapes are asserted DIRECTLY rather than left to surface as a mangled title: composition, compatibility folding, ligature expansion, canonical reordering, plus the Lu, L, N and Cc property escapes against Greek, Cyrillic, CJK and Arabic-Indic, and lookbehind. A stubbed Hermes normalize that returned its input would pass every other test in this repo"
    - "the empty-case-list control: runConformance returns ok=false for zero cases, because a runner that failed to load its data reporting a clean sweep of nothing is the single most repeated bug here. Asserted explicitly, alongside a corrupted-expectation case that must report a mismatch rather than throw"
    - "FOUND WHILE WRITING IT: the formatter rewrote the Unicode escapes into the characters they stand for, so `e + combining acute` became a precomposed e-acute and the NFKC composition check compared a string to ITSELF. Every operand is built with String.fromCodePoint now, and a test asserts the two operands differ before asserting that normalize maps one to the other"
    - "and the same pass turned a U+001F escape into a literal control character in the source. Scanned clean afterwards; the only non-ASCII left in the file is em-dashes in prose"
    - "excluded from `make verify` and from both Stryker configs - it downloads and launches a browser, and verify has a five-minute budget and no Docker. Its own CI job installs chromium and runs it, and check_workflows.js caught the new job missing from the required-check list the moment it was added"
    - "it needed its own vitest config: naming the browser file on the command line ran 7 tests instead of 18, because vitest.config.ts EXCLUDES it and an exclude beats a filename argument. That looked exactly like a pass"

