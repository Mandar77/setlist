    - strict tsconfig (strict, noUncheckedIndexedAccess, exactOptionalPropertyTypes), ESLint + Prettier
    - ruff and mypy --strict still green on the remaining Python
    - "make targets exist and work: verify, verify-fast, preflight, gate, golden"
    - make verify covers every package, completes in under 5 minutes, and needs no Docker
