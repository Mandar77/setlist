# Setlist autopilot ledger.
#
# One entry per task in docs/plan/AUTOPILOT.md S5. This file is the memory: if a
# session dies, the next one resumes from here. Update status and evidence in the SAME
# commit as the work, never afterwards.
#
# status:  todo | doing | blocked | done | needs-rethink
# deps:    task ids that must be `done` first
# blocked_on: a human session id (H1..H4) or "issue #N"
# not_before: ISO date; the task is not selectable before it
# evidence: commit SHAs, CI run URLs, measured values - required to set `done`

version: 1
updated: 2026-09-28

# Human sessions, referenced as deps. Details in docs/hitl/SESSION-*.md.
humans:
  H1: { title: "GitHub + AWS account + bootstrap stack + Expo token", status: todo, doc: docs/hitl/SESSION-1.md }
  H2: { title: "Google Cloud OAuth, test account, Firebase, optional Spotify", status: todo, doc: docs/hitl/SESSION-2.md }
  H3: { title: "Handwrite and photograph 15 song lists", status: todo, doc: docs/hitl/SESSION-3.md }
  H4: { title: "Add beta testers and send invites", status: todo, doc: docs/hitl/SESSION-4.md }

tasks:

