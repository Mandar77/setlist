    - "never-use assertions cover 18 banned resource types plus VpcConfig, provisioned concurrency, EXPRESS state machines, PAY_PER_REQUEST, PITR, log retention and bucket lifecycle"
    - "a test maps every never_use entry in budget.yaml to an assertion, so adding a banned service to the budget without asserting it fails"
