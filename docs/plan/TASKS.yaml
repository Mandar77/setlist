- id: M0A-07
  milestone: M0
  title: infra/bootstrap/account-bootstrap.yaml
  deps: [M0A-03]
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - GitHub OIDC provider; per-env deploy roles with sub scoped to environment:<env>
    - read-only diagnostics role
    - CloudFormation execution policy AND permission boundary that deny every never-use action
    - zero-spend actual budget and a forecast budget; exactly two action-enabled budgets, never three
    - IAM-deny budget action attached to the deploy roles
    - billing SNS topic with an email subscription; Cost Anomaly Detection monitor
    - cfn-lint clean and KICS clean
    - a test asserts the deny list matches PED S12 and infra/free-tier/budget.yaml never_use
    - every parameter documented in the template Metadata and in SESSION-1.md
    - no account id, ARN or email is committed - all are template parameters
  # `make lint-cfn` plus the bootstrap suite, not `make preflight`: preflight runs the
  # estimator, which is red until ADR-008 is decided. The done_when above is unchanged.
  verify: make lint-cfn && pnpm exec vitest run infra/test/bootstrap.test.ts
  evidence:
    - "cfn-lint clean on infra/bootstrap/account-bootstrap.yaml (706 lines), and it caught four real defects on the first run: a non-ASCII em dash in an IAM Description (E3031), BudgetsAction subscribers keyed SubscriptionType instead of Type (E3002/E3003), a ThresholdExpression passed as a structure where Cost Explorer wants a JSON string (E3012), and a YAML alias CloudFormation rejects outright (W1101)"
    - "that last one is the sharpest: the two budget actions share a definition object, so the serialiser emitted the second as `*a1` - the stack would have failed at upload, after the human had already done the work"
    - "the template is GENERATED from infra/bootstrap/template.ts so the deny list can be tested as data; parsing CloudFormation shorthand (!Sub, !GetAtt) in a test would be testing a YAML parser as much as a policy"
    - "28 vitest assertions in infra/test/bootstrap.test.ts, and the staleness check was proven by tampering: both it and `make lint-cfn` catch an edited template"
    - "FOUND: that staleness test was vacuous at first - importing generate.ts ran its top-level write, so the test WROTE the file it was about to compare and could not fail. Guarded behind a main-module check"
    - "every never_use entry is accounted for in exactly one of two lists: DENIED_ACTIONS or NOT_EXPRESSIBLE_IN_IAM. IAM denies actions and half the list is about properties, so a boundary that looked complete while covering two thirds would be worse than an obviously partial one"
    - "the second list must name a real SZC rule, checked against SZC_RULE_IDS - that is what stops it becoming a place to park an entry with no enforcement anywhere"
    - "and no deny rule may match zero never_use entries, so a typo'd or leftover rule cannot sit in the policy unexplained"
    - "the OIDC subject is matched with StringEquals against environment:<env>, and a test fails on any wildcard: `repo:owner/name:*` is assumable from any ref including a fork's PR branch, which is the standard way this is got wrong and it hands deploy credentials to anyone who can open a PR"
    - "the boundary opens with Allow * before subtracting - a boundary is an intersection, so one made only of denies grants nothing and the first symptom is a deploy failing on its first API call"
    - "it also denies creating a role without the same boundary (otherwise the boundary is escapable in one call), editing the boundary itself, and organizations:* - joining an Organization ends the free tier for the life of the account"
    - "conditional denies are kept in separate statements: a Condition applies to the whole statement, so folding the VPC-only Lambda deny in with the rest would quietly make every deny conditional"
    - "exactly 2 budgets and at most 2 budget actions, the free allowance. Actual spend trips AUTOMATIC; the forecast only arms a MANUAL action, because an early-month spike can forecast a month that never happens and an auto-deny would lock out the deploy that fixes it"
    - "the spend-stop policy uses NotAction so deletes and reads still work: stopping the bleeding must not block the cleanup"
    - "the diagnostics role is ReadOnlyAccess minus the billed-per-call reads - ReadOnlyAccess includes GetMetricData and Logs Insights, so a read-only role that costs money every time it is used is not the harmless thing it looks like"
    - "no account id, ARN or email is committed; a test greps the rendered YAML for both patterns, and all six parameters carry a console label and a description"

- id: M0A-08
  milestone: M0
  title: GitHub Actions workflows
  deps: [M0A-01]
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - "ci: all branches - lint, types, unit, coverage floors, accuracy gate, KICS, 2MS, CodeQL, Semgrep, OSV-Scanner, Trivy, actionlint, suppression expiry"
    - "deploy: develop -> dev -> stage; main -> prod using the artifact that passed stage, built from the PR head commit and not rebuilt"
    - "nightly: 2MS over full history, mutation tests, drift detection, contract canaries, not_before resume issues"
    - "diagnostics: read-only, workflow_dispatch, prints deployed state for Claude Code"
    - "sync-secrets: copies GitHub environment secrets into SSM SecureString"
    - "kill-switch-drill: dev and stage only, never prod"
    - Dependabot with auto-merge into develop
    - every action pinned to a full-length commit SHA
    - KICS and 2MS are blocking; Checkmarx One runs only when CX_ENABLED is set
    - every workflow no-ops safely while the AWS secrets are absent - proven by a run on a fork-like environment
  verify: actionlint .github/workflows/*.yml && make workflows
  evidence:
    - "7 workflows: ci, deploy, nightly, diagnostics, sync-secrets, kill-switch-drill, dependabot-auto-merge, plus .github/dependabot.yml targeting develop (never main - ADR-005 reserves that merge for the human)"
    - "actionlint clean, and proven non-vacuous: an invalid runs-on label is caught with exit 1"
    - "tools/check_workflows.js checks six properties actionlint has nothing to say about, because none of them are syntax: SHA pinning, the pull_request_target trap, the fork/AWS gate, the drill's prod exclusion, deploy's triggers, and explicit permissions"
    - "all three of its main checks proven by mutation: unpinning one action, adding prod to the drill's choice list, and removing the AWS_ENABLED guard are each caught"
    - "60 pinned action references across 7 workflows, every one a 40-character commit SHA. The checker parses YAML rather than grepping, so a `uses:` inside a comment cannot pass"
    - "it also carries a control asserting it found at least as many pinned actions as there are workflows - every other check reports a problem by its ABSENCE, so a parser bug would otherwise print a clean run"
    - "fork safety is structural rather than hoped for: every AWS job is gated on vars.AWS_ENABLED, which a fork never inherits, so forks no-op green instead of failing for a reason their owner cannot fix. That is also the switch that keeps CI green before Session 1"
    - "prod deploys the assembly that passed stage and refuses to rebuild: it resolves the merged develop commit, finds that commit's successful deploy run, and downloads its artifact - failing loudly if there is none. Two builds of one commit are not one artifact"
    - "the kill-switch drill excludes prod three ways (choice list, a runtime re-check because workflow_dispatch via the API ignores the list, and the workflow checker) and restores with `if: always()` - a drill that leaves the environment dead has caused the outage it was testing for"
    - "the drill also ASSERTS concurrency actually reached 0 before restoring; a switch that runs and changes nothing looks identical to one that works"
    - "sync-secrets never puts a secret on a command line (process listings are readable) and confirms with describe-parameters, which returns names only - get-parameter would print values into a public log"
    - "dependabot auto-merges patch and minor only, and deliberately uses pull_request rather than pull_request_target: the latter runs untrusted code with a write-scoped token on a public repo"
    - "added Semgrep and Trivy to CI, and pinned the OSV scanner image off :latest - a security scanner that changes under you turns an unrelated red build into a mystery, and mysteries stop being read"
    - "NOT exercised yet: no remote exists, so no workflow has run. The properties above are checked statically; the first real run is Session 1"

