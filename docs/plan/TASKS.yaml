    - "100 vitest assertions in infra/test: 19 config/profile, 81 never-use"
    - "templates genuinely differ: zero emits AWS::SNS::Topic, enterprise emits AWS::Events::EventBus; dev caps DynamoDB at 3 and prod at 10, matching budget.yaml"
    - "ProfileAwareFactory concentrates all four substitutions (Function URL/API Gateway, SNS/EventBridge, Lambda saga/Step Functions, SNS-direct/SQS-ESM); a test asserts the two profiles differ on every axis so none is accidentally shared"
