- id: CORE-01
  milestone: CORE
  title: Freeze the Python core as tools/oracle-py with a CLI
  deps: []
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - packages/core (Python) moved to tools/oracle-py unchanged
    - CLI reads text on stdin plus --source-kind and prints deterministic JSON
    - reproduces every current golden output byte for byte
    - marked frozen in its README; no new features accepted
  verify: make -C tools/oracle-py verify
  evidence:
    - "moved with `git mv`, so the history follows; not one line of the 2,375 under src/ changed. The six unit test files that exercised it came along from tests/unit/, which is what makes `make -C tools/oracle-py verify` self-contained rather than a view onto the root suite"
    - "the CLI exists so another language can call this. CORE-04 rewrites the core in TypeScript and the only way to show the port is faithful is to run both over the same text and diff - a Python API cannot be called from Vitest, a subprocess that reads stdin and prints JSON can"
    - "so every value has exactly one spelling: keys sorted at every level, `qualifiers` sorted rather than frozenset-ordered, ensure_ascii=False, one trailing newline, stdin decoded as UTF-8 explicitly rather than through the locale codec"
    - "the frozenset is the sharp one. `Hints.qualifiers` iterates in hash-table order, which is not a property any other implementation could reproduce and not one anybody should try to"
    - "golden/oracle/ holds the full output for all 8 cases, committed. golden.py checks them and fails on three things: a changed byte, a case with no frozen output, and a frozen output whose case no longer exists"
    - "verified in the failing direction, which is the only direction that proves anything: changing BASE_CONFIDENCE['dash'] from 0.90 to 0.89 failed 6 of 8 cases; deleting one frozen output failed; adding an orphan failed. A first attempt perturbed a literal no golden case reached and the check stayed green, which is exactly why the perturbation has to be checked too"
    - "`make verify` runs the golden check, not the oracle's whole gate - lint, types and tests are already covered repo-wide and running them twice would double the slowest part for nothing"
    - "this is the opposite instrument to tests/accuracy. That gate scores normalized pairs against a tolerance band so legitimate improvements do not fail it; this one pins every byte so that nothing counts as an improvement at all"

- id: CORE-02
  milestone: CORE
  title: Seed catalog builder (MusicBrainz)
  deps: []
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - about 2000 rows in golden/seed/recordings.jsonl, committed
    - ISRCs present on at least 80% of rows
    - includes live, remaster and feat. variants, and non-Latin names
    - rate limited to 1 request/s with a User-Agent carrying the repo URL
    - resumable - re-running continues rather than restarting
    - a test asserts the rate limiter is never exceeded
  verify: pnpm -C tools/seed-catalog test
  evidence:
    - "2,242 rows, 83.1% carrying an ISRC, tagged live 290 / remaster 201 / feat 216 / non_latin 386, from 133 requests"
    - "the harvest is manual and the CHECK is the gate. `make seed` reads the committed file offline and enforces every floor above, because these are properties of a file in git rather than of the code that wrote it - and a build that called MusicBrainz every time would be unreliable and rude to a volunteer-run service"
    - "the rate limiter takes its clock as a parameter, so the test asserts 500 consecutive acquisitions were spaced >=1000ms exactly rather than approximately, and does it in a millisecond. It also covers the case that actually bites: two concurrent callers reading the same last-start and both going at once"
    - "writing that test found a real defect in its own observation - reading the clock after `await` reports when the continuation was scheduled, not when the turn was granted, which under a fake clock other callers are advancing is much later. `acquire()` now returns the grant time"
    - "`type=album|live` is an AND, not an OR. Browse intersects type values, so asking for albums-or-live-albums asked for both: it returned Daft Punk's four live editions and hid Homework, Discovery and Random Access Memories entirely"
    - "a global row target quietly deletes the diversity requirement. Artists are walked in list order and the non-Latin entries are last, so stopping at 2,000 rows filled the file from the first sixteen names and reached none of the last thirteen - row count perfect, hardest requirement at zero. Every artist gets an equal share instead, enforced per release because one page of 25 albums can be 200 recordings"
    - "MusicBrainz does not model a remaster as its own recording, so the first harvest produced exactly ONE remaster row. The marker lives on releases, and reissues sit late in browse order - Queen's first three pages mention it zero times, page eight mentions it 43 times. Hence a short backwards sweep per artist, which mostly merges a tag onto rows already collected"
    - "ISRC coverage and non-Latin names pull against each other: MusicBrainz has near-complete ISRCs for modern Western releases and almost none for older non-Western ones (Άννα Βίσση 0/67, أم كلثوم 0/46, فيروز 0/52, Lata Mangeshkar 1/70). The budget is therefore per artist - at most a fifth of anyone's share may lack an ISRC - so sparse catalogues contribute less rather than being dropped to make a percentage look better"
    - "artist MBIDs are hardcoded and names are only a comment on them. Resolving by search would make the seed depend on MusicBrainz's ranking that day: searching 'Hikaru Utada' returns '[Hikaru Utada's son]' with a score of 100, a real entity, top hit, completely wrong"
    - "nothing in the test suite touches the network - fetch and the clock are both injected"

- id: CORE-03
  milestone: CORE
  title: Truth-first text generator and golden text set
  deps: [CORE-02]
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - at least 300 generated cases; expected outputs derived only from the seed, never from parser output
    - covers numbered and bulleted lists, by, CSV, timestamps, both dash orders per source kind, chat and Reddit prose, typos, emoji, odd casing, multilingual
    - deterministic for a fixed seed
    - the 8 hand-written M0 cases are retained as a readable smoke corpus
  verify: make golden
  evidence:
    - "433 cases, 2,538 expected songs, 22 recipes. The 8 hand-written cases keep their own per-case exact gate as the readable smoke corpus; the generated ones carry the aggregate gate"
    - "truth-first means nothing in tools/golden-gen reads the extractor. Cases start from seed rows whose title and credit are already known, and renderers may only ADD things the contract says are removable - a list marker, a timestamp, a qualifier - so whatever the renderer did, the answer is still the seed's title and the seed's primary credit"
    - "the primary credit is computed from MusicBrainz's own join phrases rather than by splitting a rendered string, mirroring `split_artist_credits`: feat./ft./featuring split, & and x and with do not"
    - "rows whose title already carries an annotation are excluded. 'Too Original (TJR remix)' has two defensible answers - the seed's and the one qualifier stripping produces - and a case built on it would assert a disagreement about the contract rather than test extraction"
    - "two tiers. `clean` (319 cases) is layout the deterministic pass owns and carries the PED gate; `noisy` (114) is prose, typos and undecidable orders, gated on grounding only, because PRD S7.9.3 hands the residual to the LLM and demanding recall there would be demanding a guess. Every tier is held to G2: no hallucinated songs, including on input the parser cannot read"
    - "clean scores precision 0.988, recall 0.982, F1 0.985 against gates of 0.95/0.90/0.92"
    - "the corpus found four generator mistakes that each first looked like an extractor problem: ` -- ` is not a contract separator (scored a recipe at 0.37); ` | ` collides with markdown table detection; headerless CSV has no answer unless the column order is fixed (0.54, every failure a swap); `numbered-bare` is not a marker the contract names. Fixing those four took clean F1 from 0.606 to 0.985"
    - "and three real extractor gaps, generated as noisy cases so they stay visible: a `feat.` credit on the left flips the orientation, so 'Calvin Harris feat. Dua Lipa - One Kiss' returns the title 'Calvin Harris'; `fold()` transliterates emoji via anyascii so a trailing emoji joins the title as 'sob' or 'cd'; a leading emoji is not stripped as a list marker. All three are for CORE-04"
    - "deterministic from one seed with no clock and no filesystem order; `make golden-check` is in `make verify` and a test asserts two different seeds produce different corpora, without which the staleness check would hold for a generator that ignored its seed"
    - "the oracle's byte-freeze was scoped to hand-written corpora in the same change - freezing 433 generated outputs would rewrite 433 files on every generator edit and get none of them reviewed"

- id: CORE-04
  milestone: CORE
  title: TypeScript core
  deps: [CORE-01]
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - zod schemas, normalization, deterministic grammar, span grounding, confidence, dedupe
    - ESLint purity rule - no Node, DOM or React Native APIs in packages/core
    - matches the oracle on 100% of golden cases and on at least 10000 generated inputs
    - the only permitted differences are listed in golden/diff-allowlist.yaml and are ADR-002 orientation changes
    - coverage at least 90%
    - a Stryker score is measured, recorded, and enforced as an ADR-010 ratchet so it cannot regress
    - all ADR-007 porting notes covered by ported regression tests, including the zero-ordinal crash and both M0 precision bugs
  verify: pnpm -C packages/core test
  # Amended by ADR-010. The original fifth item read "coverage at least 90%, Stryker at
  # least 70%", and the Stryker half was the only thing holding this task open. 70%
  # remains the target; it moved to CORE-04b, which blocks CORE-07, because the number
  # that matters is whether the TS suite catches regressions WITHOUT the oracle, and
  # that question only becomes answerable when the oracle retires.
  evidence:
    - "the port reproduces the frozen oracle on all 8 golden cases field for field and on all 10,000 generated inputs. That is the ADR-001 deliverable: it converts a rewrite, which would silently lose hard-won behaviour, into a verified migration"
    - "the differential was built first rather than last, and earned it six times: `\\w` and `\\b` are Unicode-aware in Python and ASCII in JS; `\\s` is a different SET in each (JS has U+FEFF, Python has U+001C-001F and U+0085); pydantic's `str_strip_whitespace` reaches `SourceDocument.text` so `lines_total` was 7 against the oracle's 6 on most cases; the digest is computed BEFORE that strip, so it is not the hash of `text`; Python's `sum()` has used Neumaier compensated summation since 3.12, making 0.55 + sum([-0.25,-0.05,0.02]) exactly 0.27 where JS gives 0.2700000000000001"
    - "widening the sentence lookahead from `[A-Z0-9\"]` to `\\p{Lu}` looked like a fix and was a bug: a Greek tracklist returned one item where the oracle returned three. Porting means reproducing, including the parts that look wrong - if the ASCII lookahead is wrong it gets fixed once, deliberately, after CORE-07"
    - "SHA-256 is implemented in the core (60 lines of FIPS 180-4) because `node:crypto` violates the purity rule and `crypto.subtle.digest` is async - making it the digest source would make the whole extraction pipeline async, on a path with a 6s p95 that also runs in a React render on device"
    - "golden/diff-allowlist.yaml is empty and enforced from both directions: an unlisted difference fails the differential, and a listed one fails as stale if the case has stopped diverging. Verified by swapping artist/title in parseDash with a matching entry (that case alone stays green), reverting it (the entry goes stale and fails), and perturbing BASE_CONFIDENCE by 0.01 (the allowlisted case fails too - an entry excuses an orientation change, not a difference that happens to be on an allowlisted case)"
    - "running a real swap through the allowlist found the design wrong: orientation moves the CONFIDENCE too, because the penalties are computed on the title and the artist. Excusing confidence would hide a scoring bug forever, so the entry must state the number it expects and the test holds the port to it - the oracle stops being the authority for an allowlisted item and a reviewed YAML line takes over"
    - "coverage 96.03% statements / 90.66% branches / 100% functions / 97.65% lines, thresholds in vitest.config.ts so `vitest run --coverage` fails on its own. Checked in both directions: raising the threshold fails, and hiding one suite drops branches to 89.65%"
    - "26 tests became 674 across 14 files, ported from the oracle's pytest suite. Six of the expectations were wrong when first written and the code was right every time - `(with X)` is not a feat credit, corner brackets are not quoted titles, `#2 Genesis` is not an ordinal, csv cells are stripped even inside quotes, control characters are removed rather than spaced, and credits peel right to left so the rightmost spelling wins"
    - "mutation testing found a test that could not fail: 96 of 127 sha256 mutants survived because the only test asserted `document.digest === sha256Hex(normalizeDocument(raw))` - both sides call the mutated function. FIPS 180-4 known-answer vectors replaced it, and a one-bit change to one round constant now fails eight tests where it previously failed none"
    - "and a mutation run that was silently testing two-thirds of the suite: Stryker's sandbox is packages/core, so the differentials' `resolve(here,'..','..','..')` missed golden/ and both files threw while loading. The dry run said 'Ran 230 tests' and carried on. test/support/repo-root.ts walks up looking for golden/oracle and throws with the paths it searched"
    - "the 10,000-input diff cannot be mutated against: instrumented it blows past any per-test timeout and failed Stryker's own dry run at 30s. Raising the timeout is worse than failing - a mutant that merely made the core slower would score as killed-by-timeout and the number would start measuring performance. It lives in its own file, excluded by name"
    - "Stryker measured at 55.41%, carried to CORE-04b under ADR-010 rather than left open here. It went 42.51 -> 47.32 -> 53.91 -> 55.41 as the table-driven tests landed. The remaining 809 survivors are conditionals inside the csv reader's character loop (reachable), regex-source mutations (mostly equivalent) and StringLiteral mutations of throw messages (killable only by asserting exact error text). The floor is still 70; what changed is that it is now a ratchet with a deadline task instead of a permanently red gate, because a break threshold of 70 against a score of 55 cannot detect a drop from 55 to 45"
    - "OPEN, and a decision rather than a task: `normalize_document` is not idempotent, in BOTH implementations. It applies NFKC and then strips control characters, so stripping can make two combining marks adjacent that NFKC never got to compare, and a second pass reorders them by combining class. Hypothesis found the witness '\\u00b4\\u001f\\u1a7f': NFKC gives space + U+0301 (ccc 230), the strip removes the U+001F between them, and U+1A7F (ccc 220) then sorts in front of it. The port reproduces this exactly, so the differential is sound and CORE-04's parity claim stands"
    - "that bug is latent, not live: normalize_document has ONE call site in each language (models.py:75, models.ts:102), so nothing currently normalizes twice. It would bite on a round trip - re-ingesting already-normalized text shifts every span after the affected position, which is the exact failure ADR-007's span contract exists to prevent"
    - "the candidate fix is one more NFKC after the strip, and it was measured rather than guessed: across all 14,900 inputs in golden/diff/normalize.jsonl and golden/diff/pipeline.jsonl it changes ZERO outputs, and the current code is idempotent on all 14,900 - so no golden pin, no digest and no gate output would move. It is still a change to the frozen oracle's behaviour, so it is a human decision with an ADR, not a quiet edit. Until then the property test is a true red that CI hits at random"

