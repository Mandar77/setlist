- id: HYG-01
  milestone: HYG
  title: Stryker break threshold becomes a ratchet (ADR-010)
  deps: []
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - packages/core/stryker.config.json break is set to the last measured score, not 70
    - the comment next to it records the measured score, the date, and that the number may only ever rise
    - make mutate-ts passes at the current score and fails if the score drops below it, proven by deleting a test and watching it fail
    - high/low thresholds still name 70 as the target so the report shows the gap
    - CLAUDE.md notes that packages/core runs the ADR-010 ratchet while other floors stay fixed
  verify: make mutate-ts
  evidence:
    - "break: 55.43, measured 2026-10-03 over 1869 mutants (809 survived, 24 timed out, 678 tests in the dry run). high/low still name 70 so the report keeps showing the gap"
    - "PASSES at the ratchet: `Final mutation score of 55.43 is greater than or equal to break threshold 55.43`, exit 0. The score reproduced EXACTLY across two independent runs, which also answers the timeout-variance worry written into the config comment"
    - "FAILS below it, proven by deleting a test: holding models.test.ts aside drops the score to 53.34 and `make mutate-ts` exits 1 with `Final mutation score 53.34 under breaking threshold 55.43`. Restored after; the suite is back to 15 files / 681 tests"
    - "and the fixed floor was ALSO proven to fire, earlier the same day: at break 70 against 55.43 it exited 1. So both sides of the comparison are measured, not assumed"
    - "FINDING worth more than the task: deleting sha256.test.ts - 11 FIPS known-answer tests - does not move the score AT ALL. Still exactly 55.43, still 809 survivors; only the killed/timeout split shifts (1010/26 to 1008/28). The differentials compare digests byte for byte against the oracle, so they already kill every sha256 mutant those tests kill"
    - "that is direct evidence for ADR-010's reason for making CORE-04b block CORE-07: the differential is doing work the unit tests are getting credit for, and CORE-07 deletes the differential. stryker.units.config.json is the number that actually matters there"

- id: HYG-02
  milestone: HYG
  title: normalize_document is idempotent, in both implementations (ADR-009)
  deps: []
  status: done
  blocked_on: null
  not_before: null
  # The first change made under ADR-009, so it is also the test of ADR-009's conditions:
  # one commit touching both languages, and a corpus that does not move.
  done_when:
    - the fix lands in tools/oracle-py and packages/core in ONE commit, per ADR-009 condition 1
    - normalize_document(normalize_document(x)) == normalize_document(x) for every x, in both languages
    - the shrunk counterexample U+00B4 U+001F U+1A7F is a permanent explicit example in BOTH property suites, so it is checked every run rather than rediscovered by chance
    - the idempotence property itself is kept, not replaced by the explicit example
    - all 8 golden/oracle cases, all 4900 normalize.jsonl records and all 10000 pipeline.jsonl digests are byte-identical, per ADR-009 condition 2
    - golden/diff-allowlist.yaml stays empty - a corpus that does not move needs no entries
    - the explicit example is written by codepoint, not pasted - a literal control character in a tracked file is its own bug
  verify: make verify
  evidence:
    - "the fix is one more NFKC after the strip, in both languages in one commit: normalize.py returns unicodedata.normalize('NFKC', stripped), normalize.ts returns out.normalize('NFKC'). ADR-009 condition 1 met by construction"
    - "ADR-009 condition 2 measured, not assumed: `make verify` green (8 golden/oracle cases byte for byte, 4900 normalize.jsonl records), `make pipeline-diff-check` reports 10000 oracle digests current, and the 3 TS differential suites pass 27/27. Zero outputs moved across all 14,900 corpus inputs, so golden/diff-allowlist.yaml stays empty"
    - "checked in the failing direction, which is the half that matters: reverting the second NFKC fails exactly 2 tests in EACH language - the property and the direct witness assertion. fast-check reports 'Property failed after 1 tests', proving the seeded example actually fires rather than being decorative"
    - "the witness is built with chr(0x00B4)+chr(0x001F)+chr(0x1A7F) and String.fromCodePoint(0x00b4, 0x001f, 0x1a7f), never as a literal. Twice in this repo a tool has decoded an escape into the real invisible character on the way to disk; a literal U+001F in a tracked file would also be a line-ending and secret-scanner hazard"
    - "the assertion is not only 'idempotent' but the specific ordering: the normalized witness is [0x20, 0x1A7F, 0x0301]. A fix that made the function idempotent by some other route would still have to produce canonical order"
    - "NEW: packages/core/test/properties.test.ts, 7 property tests over fold, pyStrip and normalizeDocument. The TS side had NO property suite, which is why it reproduced the bug silently - the differential compares the two implementations against each other, so a defect they share is invisible to it by construction. fast-check 4.10.2 added (14 days old, clears the cooldown)"

- id: HYG-03
  milestone: HYG
  title: Dependabot proposes no majors and one grouped PR per ecosystem (ADR-011)
  deps: []
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - .github/dependabot.yml ignores all version-update:semver-major, in all three ecosystems
    - minor and patch are grouped into one PR per ecosystem, github-actions included - it has no group today
    - weekly schedule and cooldown default-days 7 kept, with the per-type keys, matching minimumReleaseAge and exclude-newer
    - tools/check_workflows.js asserts those properties of dependabot.yml and fails when any one is removed
    - the ten open major PRs are closed with a comment pointing at ADR-011
  # Justified under the AUTOPILOT S2.3 no-new-tooling rule by an incident rather than a
  # preference: `cooldown.default-days` was configured, reported back by the API, and
  # acted on nothing, because the per-semver-type keys default to 0 and override it.
  verify: node tools/check_workflows.js
  evidence:
    - "all three ecosystems now carry `ignore: [{dependency-name: '*', update-types: [version-update:semver-major]}]`, and github-actions gained the patch-and-minor group it never had - it was producing one PR per action, which is how a week's dependency review becomes eleven tabs and gets skipped"
    - "check_workflows.js asserts four properties per ecosystem: majors ignored, minor+patch grouped, weekly, and all four cooldown keys at 7. Reports `dependabot: 3 ecosystems ignore majors, group minor+patch, weekly, 7-day cooldown`"
    - "checked in the failing direction four ways, each restored after: majors un-ignored in npm, cooldown.semver-major-days back to 0, schedule changed to daily, and the github-actions group removed. All four fail with the specific ecosystem and property named"
    - "the second of those is the original silent bug reproduced deliberately - `semver-major-days: 0` is what Dependabot's job definition carries unless set, and it overrides `default-days: 7` sitting right above it. That config was set, reported back by the API, and acting on nothing. It now fails"
    - "the ten open major PRs were closed with a comment pointing at ADR-011 and naming TS-6 as the worked example of a major becoming a task. No PR was merged (ADR-005); zero Dependabot PRs remain open"

- id: HYG-04
  milestone: HYG
  title: Auto-merge re-runs on every update and can disarm (ADR-011)
  deps: [HYG-03]
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - the workflow runs on pull_request types opened, synchronize, reopened and edited - a title or base change is a reclassification too
    - anything that is not patch or minor disarms auto-merge if it is armed, rather than only declining to arm it
    - unclassified update types disarm, for the same reason they do not arm
    - the job is named stably so it can be a required check, and HYG-05 requires it
    - a test or dry run proves the disarm path actually calls the API, not only that the step is reachable
  # The disarm step and its complement check landed with the incident (commit 8e04530).
  # What is left is making it re-run on every relevant event and gate the merge instead
  # of racing it.
  verify: bash tools/test-dependabot-disarm.sh
  evidence:
    - "triggers spelled out as [opened, synchronize, reopened, edited] rather than left to the pull_request default. `synchronize` is the event that fired on 2026-10-03 when Dependabot rewrote the patch PR into a major on the same branch; `edited` covers a retargeted base or rewritten title. Each is a chance for the classification to have changed under an arming that was correct when it was made"
    - "the job is renamed `Dependabot auto-merge policy` - stable, and it says policy rather than `enable` now that it covers both directions. ADR-011 makes it a required check and a required check is matched BY NAME, so renaming it later silently stops it gating. HYG-05 adds it to the ruleset"
    - "the disarm logic moved to scripts/ci/dependabot-disarm.sh so it could be tested at all. A workflow step is unreachable from a test runner, and `the step exists` is not the property that matters - `the step calls the API` is"
    - "tools/test-dependabot-disarm.sh runs it against a stubbed `gh` that logs every invocation: armed major disarms, unarmed does not call merge at all (calling --disable-auto on an unarmed PR is an error, and `|| true` would swallow a real failure with it), unclassified disarms like a major, a patch is REFUSED outright so a caller/script disagreement is loud, and an API failure exits non-zero. 5 passed"
    - "checked in the failing direction: removing the disarm call fails 3 of the 5, including the one named after the incident. check_workflows.js also failed correctly when the logic moved out of the step, which is how that regex got updated rather than silently stopping matching"
    - "scripts/ci/*.sh added to the CI shellcheck glob - it covered scripts/hitl, tools and .claude/hooks, so a new script directory would have gone unchecked"

- id: HYG-05
  milestone: HYG
  title: CI jobs are required status checks for PRs into develop (ADR-011)
  deps: [HYG-04]
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - scripts/hitl/github-setup.sh adds required_status_checks to the protect-develop ruleset, listing every CI job plus the HYG-04 auto-merge job
    - the script stays idempotent and --dry-run still prints every call without making it
    - a red build cannot be merged into develop by approval alone, proven on a scratch PR that is then closed
    - CONFIRMED EMPIRICALLY - a fast-forward push of an already-green commit from a task branch still succeeds, because required checks pass on the commit rather than on the push. If it does not, that is a stop-rule item, not a reason to drop the requirement
    - main's ruleset is untouched
  # The confirm step is the risk in this task. protect-develop deliberately carries no
  # pull_request rule so the autopilot can fast-forward; required_status_checks applies
  # to pushes as well, and a requirement that blocks the normal loop would be found at
  # the worst possible moment.
  verify: node tools/check_workflows.js
  evidence:
    - "protect-develop gains required_status_checks over all 13 jobs, strict policy OFF - strict means `branch must be up to date before merging`, which for a fast-forward flow would demand a rebase-and-rerun for every push that lost a race. Still no pull_request rule: requiring a PR on develop would stop the autopilot loop dead (ADR-005)"
    - "the trap this task existed to find, found BEFORE applying anything: the auto-merge job only ran on pull_request, so it would never report on a task-branch commit - and a required check that is absent blocks the push. It now also runs on push to develop and task/**, reporting success immediately when there is nothing to police. A skipped job and a successful job are not the same thing to a required check"
    - "and a second one inside that fix: the disarm step's condition is NEGATIVE (!= patch && != minor), and on a push update-type is the empty string, which is neither - so without an explicit guard the disarm would have fired on every push with no PR to disarm. A negative condition over a value that may not exist defaults to firing"
    - "check_workflows.js asserts the required-check list matches the jobs exactly, both ways: a renamed job leaves a required check nothing produces (blocks every push - loud but baffling), and a new job nobody adds to the list runs, can fail, and gates nothing (silent, and worse)"
    - "applied by extracting the JSON from github-setup.sh programmatically and PUTting that, rather than running the script - the script pushes main unless told not to, and ADR-005 says never. The committed script stays the source of truth and the checker is what keeps it honest"
    - "CONFIRMED EMPIRICALLY: this very commit is the test. Pushed to task/hyg-05-required-checks, CI green there, then fast-forwarded to develop - the push succeeded because required checks are evaluated against the COMMIT, which already carried its green checks from the task branch. Nothing re-ran and nothing blocked"

- id: HYG-06
  milestone: HYG
  title: Lockfile-age check runs where it is useful and fails closed carefully (ADR-011)
  deps: []
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - the check runs when pnpm-lock.yaml changes and nightly, instead of on every push
    - publish dates are cached - a version's publish time is immutable, so only new name@version pairs are fetched
    - the cache is keyed so a stale entry cannot mask a changed lockfile, and a cache miss falls back to the registry rather than passing
    - transient registry errors (5xx, socket resets, rate limits) retry with backoff before the check fails
    - an age that still cannot be established after retries FAILS - unknown is not mature, and that rule does not soften
    - both must-fail directions from the original check still fail, and a simulated run of 5xx-then-success passes without a false red
  verify: make lockfile-maturity
  evidence:
    - "cache at .cache/lockfile-maturity.json, keyed by name@version and holding the publish DATE, never the verdict. A cached `mature` would be a cached answer to a question whose answer depends on when it is asked; a cached publish date cannot go stale because a version's publish time is immutable"
    - "that key shape is also why it cannot mask a changed lockfile: a lockfile that moves to a new version introduces a key the cache does not have, so it is fetched. There is no key under which a stale answer and a new question could collide"
    - "cold 6.6s / 360 fetched, warm 0.6s / 360 from cache - an 11x difference, which is what makes it cheap enough to run on every lockfile change"
    - "a corrupt or truncated cache returns empty and everything is fetched. It fails toward the network, never toward `assume mature`"
    - "retries: 4 attempts, exponential backoff with jitter so twelve workers hitting a rate limit do not all return at the same instant. A 404 is an ANSWER and is NOT retried - the package is not there - while 5xx, 429 and socket resets are registry weather"
    - "proven with a stand-in registry rather than argued: 503 twice then 200 -> check exits 0 (6 failures, 3 successes served, no false red); 503 forever -> check exits 1 with `cannot establish age` (12 failures = 4 attempts x 3 packages). A transient error never becomes a pass"
    - "tests/fixtures/lockfile-maturity/three-packages.yaml exists because the retry test needs a registry that decides when to fail, and a stand-in registry has to know every version the lockfile names. Three is enough for concurrency, a scoped name and the cache together"
    - "ci.yml runs it only when pnpm-lock.yaml moved (git diff against the PR base or the push's before-SHA; an unknown base runs it, since the expensive answer is always safe and the skipped one is not). nightly.yml runs it with --no-cache, which catches the case that has nothing to do with the lockfile changing: a version being unpublished or yanked turns an established age into one that cannot be established"
    - "the original must-fail directions still fail with caching in play: the unknown-version fixture, and the real lockfile against a hundred-year floor"
    - "NEAR MISS worth recording: the actions/cache pin was written from memory and was a fabricated SHA. check_workflows.js validates the 40-hex FORMAT, not existence, so it passed. Caught by checking the tag against the API - the real v4 commit is 0057852. GitHub fails loudly on a nonexistent pin, so the blast radius is a red run rather than a silent hole, but format-valid is not the same as real"

- id: VERIFY-PINS
  milestone: HYG
  title: Every pinned action SHA is resolved against the GitHub API
  deps: []
  status: done
  blocked_on: null
  not_before: null
  # A pin written from memory is forty hex characters, which is exactly what the existing
  # check tests for. One got committed on 2026-10-03 - an actions/cache SHA recalled
  # rather than fetched - and the format check passed it. GitHub refuses a nonexistent
  # action at run time, so the blast radius was a red run, but the check whose entire
  # purpose is pinning had nothing to say about it.
  done_when:
    - check_workflows.js resolves every pinned action SHA through the GitHub API
    - the resolved commit must match the tag named in the trailing comment, so `@<sha> # v4` fails when the sha is not v4's commit
    - a valid 40-hex format alone does NOT pass - proven by a must-fail case using a well-formed SHA that does not exist
    - a second must-fail case uses a real SHA from the right repo whose tag comment is wrong
    - network failures retry and then FAIL rather than passing, matching check_lockfile_maturity.js - unverifiable is not verified
    - results are cached by sha (an immutable fact) so the common case costs nothing, and it runs where the workflows change plus nightly
    - runs in CI, not in `make verify` - that gate is offline by contract
  verify: make verify-pins
  evidence:
    - "`check_workflows.js --verify-pins` resolves every pin through the GitHub API and compares it to the tag in its trailing comment. Opt-in flag rather than always-on because `make verify` is offline by contract; `make verify-pins` and a CI step run it"
    - "two distinct lies are possible in `owner/repo@<sha> # v4` and only one is loud: a SHA that does not exist is refused by GitHub at run time, while a SHA that exists and is NOT v4 is never complained about by anything. Both now fail here"
    - "checked in the failing direction three ways: a well-formed SHA that does not exist FAILS; a real SHA from the right repo with a wrong tag comment FAILS; and inconsistent comments on one SHA FAIL. 71 references across 26 distinct pins resolve clean"
    - "annotated tags are dereferenced to the commit - `git/ref/tags/v4` returns a tag object for an annotated tag, and comparing that object's sha to a commit pin would fail every annotated-tag action"
    - "FOUND BY THE CHECK, in the check: `github/codeql-action/init` is a SUBDIRECTORY action living in `github/codeql-action`, and asking the API for `repos/github/codeql-action/init` 404s in a way that reads exactly like a missing tag. The first run reported two such failures and both were this parsing bug, not a bad pin"
    - "and a second one, found by the must-fail case rather than by reading: reading the version comment with `find()` gave every occurrence of a repeated pin the FIRST line's tag, so changing one comment produced the same failure once per occurrence, attributed to lines that were correct. Now collected as a set per pin, which also makes an inconsistency reportable in its own right"
    - "unverifiable is not verified: 4 attempts with exponential backoff and jitter, then FAIL. A 404 is an answer and is not retried. Same rule as check_lockfile_maturity.js"
    - "resolved sha->tag answers are immutable, so the cache never expires: cold 2.4s, warm 0.5s"

- id: HYG-07
  milestone: HYG
  title: Replace the hand-written SHA-256 with a vetted library (ADR-010)
  deps: []
  status: blocked
  blocked_on: "issue #17 - Stryker reports orientation.ts mutants as survived that demonstrably fail tests"
  not_before: null
  # ADR-010's 2026-10-03 amendment. 60 lines of hand-implemented FIPS 180-4 is not an
  # asset. The original reason for writing it was sound - node:crypto breaks the ESLint
  # purity rule and crypto.subtle.digest is async, which would make the whole extraction
  # path async on a 6s p95 - but that argues for a synchronous pure implementation, not
  # for ours.
  done_when:
    - "@noble/hashes replaces packages/core/src/sha256.ts, or an ADR records the specific reason it cannot - a bundle-size budget it breaks, a Hermes incompatibility, or an ESLint purity violation. `it works` is not such a reason"
    - the FIPS 180-4 known-answer vectors in sha256.test.ts are kept and still pass against the library
    - the differential is unchanged - every digest in golden/oracle and the 10,000 pipeline digests byte for byte
    - the ESLint purity rule still passes, and the library is checked to be pure (no node:crypto, no DOM)
    - "the ratchet is re-baselined IN THIS COMMIT, and only if surviving mutants does not rise: deleting ~127 well-covered mutants shrinks the denominator and would otherwise LOWER the score while improving the code"
    - both mutation numbers reported - full suite and stryker.units.config.json
  verify: make mutate-ts
  evidence:
    - "DONE: @noble/hashes 2.4.0 replaces the hand-written FIPS 180-4 compression. Audited, zero dependencies, and checked rather than assumed to be pure - no `node:` import and no DOM access anywhere in its shipped files, so the ESLint purity rule still passes"
    - "the UTF-8 encoder stays hand-written, deliberately: it is not a cryptographic primitive, TextEncoder is a platform global rather than a language feature (Hermes), and that function DEFINES the lone-surrogate behaviour the oracle's digests depend on. Replacing it would be a behaviour change wearing a cleanup's clothes"
    - "every digest byte-identical: 707 core tests pass including the FIPS known-answer vectors, `make verify` green over the 8 golden cases and 4,900 normalize records, and `make pipeline-diff-check` reports 10,000 oracle digests current"
    - "BLOCKED on the last done_when item only. Re-baselining requires knowing whether surviving mutants rose, and the full run says 809 -> 869 - but 63 of those are orientation.ts mutants that Stryker reports as survived and that a hand-applied edit proves are killed (issue #17). Excluding that file the comparison is like-for-like with the pre-orientation baseline and survivors went 809 -> 806, which does NOT rise; including it, the condition fails"
    - "so the number ADR-010's condition depends on is produced by an instrument just shown to be wrong, and nothing has been re-baselined on it. `make mutate-ts` stays at break 55.43 and fails at the measured 52.30, which makes the nightly mutation job red until #17 is resolved. That is the accurate state"
    - "the drop itself is expected and is exactly what ADR-010's re-baseline rule anticipates: removing ~62 well-covered sha256 mutants shrinks the denominator, lowering the percentage while improving the codebase"

