    - "FOUND AND FIXED: github-setup.sh created dev, stage and prod but NOT diagnostics, which M0A-07's diagnostics role trusts by name and two M0A-08 workflows deploy to. The role would have been unassumable, surfacing as an opaque STS error rather than 'you forgot an environment'"
