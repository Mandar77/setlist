- id: PREP-02
  milestone: M0
  title: Windows hardening - UTF-8 mode, LF normalisation, no heredocs
  deps: []
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - PYTHONUTF8=1 exported from the Makefile so every recipe inherits it
    - PYTHONUTF8=1 set in the env block of .claude/settings.json so Bash tool calls and hooks inherit it
    - .gitattributes enforces "* text=auto eol=lf" with binary types excluded from normalisation
    - git add --renormalize . is a no-op afterwards, proven by an empty diff
    - no Python in the repo decodes subprocess output or reads a file without an explicit utf-8 encoding
    - guard-bash.sh self-test passes - blocks aws, cdk/sam deploy, force push, push to main, gh pr merge, gh secret and destructive gh api; allows make verify and git push task/*
    - make verify green after renormalisation
    - CLAUDE.md carries the rule - create and edit files with the file tools, never shell heredocs
  verify: make verify
  evidence:
    - "PYTHONUTF8=1 exported from the Makefile (verified reaching recipes) and set in .claude/settings.json env"
    - ".gitattributes expanded: eol=lf plus 21 binary types; git ls-files --eol shows 82/82 i/lf"
    - "found and fixed 28 files with CRLF in the working tree, written by Python write_text - the exact hazard this task exists to prevent"
    - "tools/check_line_endings.py added with --fix; wired into make verify and CI"
    - "tools/test-guard-hook.sh: 30 assertions, 19 must-block and 11 must-allow, all passing; wired into make verify and CI"
    - "CLAUDE.md documents the heredoc ban with the four concrete failure modes observed" 

- id: PREP-03
  milestone: M0
  title: Real 2MS full-history gate in github-setup.sh
  deps: []
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - github-setup.sh runs a real 2MS scan over FULL git history before it pushes anything
    - it refuses to push, with a non-zero exit, when 2MS reports any finding
    - it fails CLOSED when 2MS cannot run at all - no Docker and no binary means refuse to push and print the install options, never skip
    - --dry-run reports exactly what the scan would do without running it and without pushing
    - tools/check_no_secrets.py stays a separate CI check rather than a substitute, and CI runs both
    - SESSION-1.md documents the scan, the install options, and what to do when it finds something
    - shellcheck clean
  verify: shellcheck scripts/hitl/*.sh
  evidence:
    - "scripts/hitl/scan-secrets.sh: 2MS v5.4.0 pinned, SHA-256 verified before unzip or execution, full history + pristine git-archive export of HEAD"
    - "11/11 gate properties verified empirically against the real binary: history catches deleted secrets, --all-branches required, explicit --ignore-on-exit none beats the env override, errors exit 1 so the gate tests non-zero, shallow clones rejected"
    - "fail-closed proven with stub scanners: refuses on exit 1, 2 and 3; passes only on 0"
    - "checksum tamper test: a wrong expected digest refuses to unzip or execute"
    - "shellcheck 0.11.0: 0 findings across scripts/hitl/*.sh, tools/*.sh, .claude/hooks/*.sh"
    - "tools/check_no_secrets.py retained as a separate CI check (also catches account ids, ARNs, personal data)"
    - "adversarial review found 5 further defects, all fixed and covered by tests: a multi-line guard bypass (cd X then an aws call on line 2 was ALLOWED), a 2MS_* env sanitiser that was a silent no-op because unset cannot remove a name starting with a digit, _git swallowing git's exit code so a git failure read as a clean scan, an execute-bit check that aborted on a fresh clone, and commit author identities that no scanner looked at"
    - "commit-identity gate added: security/published-identities.txt plus a pre-push check, because 2MS reads diff content and never sees author/committer headers"

