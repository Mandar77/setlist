- id: M0A-03
  milestone: M0
  title: SetlistZeroCostPack (cdk-nag)
  deps: [M0A-02]
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - one rule per never-use item in PED S12, each with a stable SZC-* id
    - every rule has BOTH a failing fixture and a passing fixture under infra/nag/test
    - the platform stack passes the pack cleanly
    - make preflight ENV=dev rejects tests/fixtures/nat-stack with rule SZC-NAT
    - the rule list is asserted against infra/free-tier/budget.yaml never_use, so the two cannot drift
  # `make nag`, not `make preflight`: preflight also runs kics (Docker) and estimate
  # (M0A-05, not built), so it cannot pass until those land - and the rejection this
  # task is about reaches preflight THROUGH nag, which is a prerequisite of it. The
  # done_when above is unchanged; `make preflight ENV=prod` is exercised at M0A-06.
  verify: make nag ENV=dev && make test-ts
  evidence:
    - "22 SZC rules, one per never_use entry in budget.yaml, each carrying the actual charge ($0.045/hour for NAT, $0.40/secret/month for Secrets Manager) rather than the word 'banned'"
    - "73 vitest assertions in infra/nag/test: every rule fires on a violating fixture AND stays quiet on a compliant one, so a rule that rejects everything fails the suite"
    - "a drift test maps every never_use line to a rule and every rule to a fixture pair, in both directions, so neither list can grow without the other"
    - "rules read the RENDERED template, not typed L1 accessors - SZC-LAMBDA-VPC and SZC-LAMBDA-PROVISIONED first PASSED their violating fixtures because addPropertyOverride leaves node.vpcConfig undefined while putting VpcConfig in the template; any escape hatch was a bypass"
    - "SZC-SQS-ESM follows Fn::GetAtt to the referenced resource instead of pattern-matching the ARN: a queue declared in the same stack renders as logical id Q63C6E3AB, which matches neither ':sqs:' nor 'queue'"
    - "SZC-ALARM-BUDGET is new, covering the 'more than 7 alarms' entry that had no rule; it flags the alarms PAST the budget (prod 5 / stage 2 / dev 0 from budget.yaml) rather than all of them, so the failure names one to remove"
    - "make nag runs both directions: the dev/zero stacks must pass the pack, and tests/fixtures/nat-stack must be REJECTED with SZC-NAT - a pack that is never attached also produces a clean synth"
    - "tools/check_nag_gate.js carries three controls: the same fixture must synthesize cleanly with -c nag=false, the rejection must name SZC-NAT, and it must still be blocked with no -c nag flag at all"
    - "the first control earned its place immediately - the fixture could not resolve aws-cdk-lib outside infra/ and crashed, which without it would have read as the gate firing; it is now its own workspace package pinned to infra's CDK version"
    - "app.synth() does NOT throw on an error annotation (measured: it writes aws:cdk:error metadata and exits 0) - the CDK CLI is what fails the build, so the gate check goes through the real CLI rather than running the app with tsx"
    - "the pack is ON by default under profile=zero rather than opt-in behind -c nag=true: a synth that forgets the flag would otherwise be unguarded, and nothing about it would look different"
    - "enterprise skips the pack by design, and a control test asserts the enterprise platform stack genuinely WOULD violate it - otherwise 'we skip it there' is a statement about nothing"
    - "adding nag/ to infra/tsconfig.json exposed that the whole directory was unchecked by make types; it imported IConstruct from aws-cdk-lib, which does not export it"

- id: M0A-04
  milestone: M0
  title: KICS zero-cost Rego queries
  deps: [M0A-02]
  status: done
  blocked_on: null
  not_before: null
  done_when:
    - one Rego query per SZC rule in security/kics-queries/zero-cost/
    - positive and negative test samples for each query, run by KICS in CI
    - the default KICS catalog also runs against infra/cdk.out and the workflow files
    - zero HIGH or CRITICAL findings on the platform stack
    - the KICS action is pinned to a release SHA
  verify: make kics
  evidence:
    - "22 queries, one per SZC rule, GENERATED from a spec in tools/gen_kics_queries.js: four files per rule times 22 rules, all of which must agree with infra/nag/rules.ts, is a list that drifts within a month - and the drift is silent in the worst direction, since a rule present in one place and absent in the other looks enforced from either side"
    - "infra/nag/test/kics-parity.test.ts asserts the two packs cover exactly the same rule ids in both directions, one query per rule, and runs in `make verify` where there is no Docker"
    - "tools/check_kics_queries.js scans a positive sample per query (all 22 must fire) and the compliant counterparts together (nothing may fire) - a query with a typo'd resource type or a Rego error is SILENT, which is indistinguishable from compliance in a scan of the real templates"
    - "both directions of that checker were proven by mutation: pointing SZC-NAT at a nonexistent resource type is caught as 'did not fire', and deleting a type guard so a query matches everything is caught as 'fired on compliant samples'"
    - "`make kics` also refuses to run on a stale pack (`gen_kics_queries.js --check`), so the queries reviewed in a diff are the queries that ran"
    - "FOUND AND FIXED: `make kics` scanned whatever sat in infra/cdk.out, which after a `make synth-matrix` includes ENTERPRISE templates - the pack correctly flagged a custom event bus against a profile that never ships. Worse in the other direction: a stale clean template masks a bad current one. A new `cdk-out-zero` target synthesizes all three environments under profile=zero into a fresh directory and the scan reads only that"
    - "FOUND AND FIXED: the default catalog reported SQS without server-side encryption. SQS_MANAGED encryption is free (SSE-SQS uses SQS-owned keys; SSE-KMS would need a customer-managed key, which is SZC-KMS-CMK at $1/month), so this was a security fix with no cost - MEDIUM findings went from 3 to 0"
    - "FOUND AND FIXED: 8 unpinned GitHub Actions. All are now pinned to full commit SHAs with the version in a trailing comment, including Checkmarx/kics-github-action at the commit behind v2.1.20"
    - "DELIBERATELY NOT FIXED: SNS topics have no KmsMasterKeyId (3 LOW). SNS offers no free managed encryption, so every publish would cost a KMS request - prod is forecast at 92,000 publishes/month against a 10,000-request KMS share, nine times over, to encrypt a payload that is a job id and a correlation id. Recorded at the construct with the arithmetic"
    - "default catalog on the platform stacks and the workflow files: 0 CRITICAL, 0 HIGH, 0 MEDIUM, 6 LOW"
    - "the CI job scans .github/workflows along with the templates, so it checks whether its own actions are pinned"

- id: M0A-05
  milestone: M0
  title: tools/free-tier-estimate
  deps: [M0A-02]
  status: blocked
  blocked_on: ADR-008 (docs/hitl/QUEUE.md) - the committed budget breaches its own 70% gate
  not_before: null
  done_when:
    - reads infra/free-tier/budget.yaml and usage-model.yaml; no numbers hardcoded in the tool
    - fails with a non-zero exit when any environment exceeds gate_pct (70%) of any allowance
    - tests reproduce the PED arithmetic exactly - 15-song playlist = 50 + 15*50 = 800 YouTube units; 7000/day / 800 = 8 playlists/day
    - tests reproduce the PED S10.8 Lambda and CloudFront bindings
    - emits a markdown table suitable for a PR comment, sorted by percentage of allowance used
    - also reports which limit binds first, across AWS and provider quotas together
  # The tool is finished and its own tests pass; `make estimate` exits 1 because the
  # committed budget breaches its own 70% gate in seven places. That is the gate
  # working, not the tool failing - and per AUTOPILOT S2.4 the fix is a human decision
  # with an ADR, not an edit that makes the number go away.
  verify: make estimate   # exits 1 until ADR-008 is decided
  evidence:
    - "tools/free-tier-estimate is TypeScript per ADR-004; the Makefile placeholder pointed at a Python module, which would have set the wrong precedent the day it was filled in"
    - "reads budget.yaml and usage-model.yaml and holds no numbers of its own - it imports infra/lib/config/budget.ts rather than parsing budget.yaml a second time, since that file is what CI gates on AND what the runtime sentinel trips on"
    - "21 vitest assertions; PED arithmetic checked against the real data (800 units a playlist = 50 + 15*50; 7000/800 = 8 playlists/day), gate behaviour against synthetic budgets so a legitimate budget change does not fail a test and create pressure to edit it"
    - "gate tests cover both directions plus both boundaries: 69% passes, 70% passes, 71% fails, and any use of a zero allowance is Infinity rather than a comfortable 0%"
    - "added a `basis` field to each limit (monthly/per_day/per_second/fixed) because the allowances are not the same shape: 20M monthly DynamoDB writes against a 25 WCU allowance is 8 WCU, or 0.00008% of a monthly total - a factor of 2.6 million of false comfort"
    - "an unrecognised basis throws instead of defaulting to monthly; `per_secnod` silently meaning monthly is how DynamoDB capacity would come to look infinitely spacious"
    - "the usage model declares which limit each metric charges, and an operation carrying an unmetered cost is an error - an unmetered cost counts as zero, and zero reads as headroom"
    - "limits nobody meters are listed as `not modelled` rather than shown at 0%: cloudwatch_alarms, cognito_mau, data_transfer_out_gb, sqs_requests, step_functions_transitions and three others are unforecast, not safe"
    - "FINDING (blocks this task): seven rows breach the 70% gate on the committed data. dev gets 500 YouTube units/day and one 15-song playlist costs 800, so dev cannot create a single playlist - a plain bug, not a threshold argument"
    - "FINDING: PED S11 sized prod at 250 playlists/month BECAUSE that is what 7000 units/day buys, which is 95.2% of the share against a gate set at 70%; budget.yaml asserts both, twelve lines apart"
    - "FINDING: cloudfront.prod.planned_requests says 350,000 while the usage model implies 732,000, and baseline log ingest is 80% of prod's share before any traffic; reported as drift rather than resolved by picking the friendlier number"
    - "no number was edited to make the gate pass - see docs/adr/0008 and docs/hitl/QUEUE.md"

