# Security-finding suppressions.
#
# Every entry needs an owner, a scope, a reason and an expiry no more than 90 days out.
# CI fails on an expired entry (tools/check_suppressions.py), which is the point: a
# suppression is a decision to accept risk for a while, not a way to delete a finding.
#
# Adding one is a review conversation, not a config change.
#
# `owner` is a GitHub handle, never an email address: this repository is public
# and ADR-005 keeps personal data out of it.
#
# This file is the only place a suppression is written. `.trivyignore.yaml` is
# GENERATED from the `tool: trivy` entries below — see the bottom of
# tools/check_suppressions.py for why, and `make suppressions-write` to regenerate.
# Hand-editing the generated file fails `make verify`, so a scanner cannot be quieted
# without the paperwork, and paperwork cannot sit here describing a suppression that
# the scanner is not actually applying.
#
# Entries with `tool: trivy` also need `kind`, naming which Trivy finding class the id
# belongs to: misconfiguration | vulnerability | secret | license.

version: 1
max_age_days: 90

suppressions:
  - id: AWS-0095
    tool: trivy
    kind: misconfiguration
    scope: infra/bootstrap/account-bootstrap.yaml
    reason: >
      "Topic does not have encryption enabled" on BillingTopic, which carries budget
      alerts to one email address. Encrypting it is the one fix available and it costs
      $1/month forever, which is not a rounding error against a $0 budget — it IS the
      budget. SNS server-side encryption needs a KMS key, and the AWS-managed
      alias/aws/sns cannot be used here: its key policy is not editable and does not
      grant the budgets.amazonaws.com service principal the GenerateDataKey it needs to
      publish. That leaves a customer-managed key, and a customer-managed key is $1 a
      month whether or not anything uses it. Worse, the failure mode of getting its key
      policy wrong is silent: budget notifications simply stop arriving, and the budget
      alarm is one of the four layers that keep this account at $0. Paying a guaranteed
      dollar for a chance of disabling the thing that guards the dollars is the wrong
      direction. What is actually accepted: the text "your bill crossed $X" sits
      unencrypted at rest in SNS, in a single-tenant account, readable by the one
      principal who already gets it by email.
    owner: Mandar77
    opened: 2026-10-02
    expires: 2026-12-31

  # RESTORED 2026-10-07. These two were deleted earlier the same day on a misreading:
  # an osv-scanner run reported "has unused ignores" for both, which was taken as
  # evidence the advisories no longer matched the tree. They did. With the shell-quote
  # and source-map-js criticals fixed, the next scan reported both again, each with
  # `FIXED VERSION: --` - exactly what the reasons below already said.
  #
  # The lesson is narrow and worth keeping: "unused ignore" is a statement about one
  # scanner run, not about whether a package is still vulnerable. `pnpm why` said both
  # packages were still installed, which should have been the stronger signal.
  - id: GHSA-vfj7-8cjw-p6xm
    tool: osv
    scope: pnpm-lock.yaml
    reason: >
      Stack-exhaustion denial of service in braces through deeply nested patterns.
      There is no fixed version: OSV records `last_affected: 3.0.3` with no `fixed`
      event, so 3.0.3 is both the newest release and still vulnerable, and no override
      can move forward out of it. braces reaches this repository four levels down from
      the Expo app, through metro's glob matching, and is BUILD TOOLING ONLY - it runs
      on a CI runner and in a developer's bundler, never in a Lambda and never inside
      the APK. The attack needs a hostile glob pattern, and the only patterns reaching
      it are the ones written in this repository's own Metro config. What is accepted:
      a CI runner could be made to exhaust its stack by a glob nobody but us supplies.
      Revisit when braces ships a fix; `ignoreUntil` makes that a failing build rather
      than a decision nobody returns to.
    owner: Mandar77
    opened: 2026-10-04
    expires: 2026-12-31

  - id: GHSA-86w9-cpqp-85rv
    tool: osv
    scope: pnpm-lock.yaml
    reason: >
      node-forge accepts extra nested DigestAlgorithm elements when verifying RSA
      PKCS#1 v1.5 signatures, which weakens signature verification. No fixed version
      exists - OSV records `last_affected: 1.4.0` with no `fixed` event. It arrives
      under @expo/cli, which uses it to mint the self-signed certificate the local
      development server offers over HTTPS. Nothing in this project verifies a
      signature with it, and it is not in the APK, in any Lambda, or in any production
      path: the code that could be exploited is never reached. What is accepted: a
      developer running `expo start` has a TLS certificate generated by a library with
      a signature-verification flaw it does not use here.
    owner: Mandar77
    opened: 2026-10-04
    expires: 2026-12-31

  - id: c8dee387-a2e6-4a73-a942-183c975549ac
    tool: kics
    scope: infra/cdk.out/**/setlist-*-platform.template.json
    reason: >
      "DynamoDB With Aws Owned CMK", HIGH, in the KICS default catalog. It wants
      SSESpecification.SSEEnabled true, which switches the table from the AWS OWNED key
      to the AWS MANAGED key alias/aws/dynamodb. Read the finding precisely: the table
      is encrypted at rest either way, and the only question is which key does it.
      PED S10.6 chose AWS-owned keys. The owned key is free and sits outside KMS quotas
      entirely; the managed key would draw on the shared 20,000 free KMS requests a
      month that the token vault already uses. DynamoDB caches the table key per caller
      and refreshes it roughly every five minutes of active traffic, so this is not a
      per-read charge - it is a steady, modest draw on an allowance that is spoken for.
      What it would buy is a CloudTrail audit trail of key usage, which this project
      does not need: a single-tenant account whose table holds song titles and
      idempotency keys, no personal data, and which PED D6 already records as
      reconstructible from the source text. Spending a reserved quota on an audit trail
      nobody reads is the wrong trade. Appeared only now because it was unreachable
      before: it matches AWS::DynamoDB::Table, and until ADR-013 the stack rendered a
      GlobalTable.
    owner: Mandar77
    opened: 2026-10-04
    expires: 2026-12-31

